.brand small{font:600 13px Barlow,sans-serif;color:var(--muted);letter-spacing:.02em}.acard .brand{border-bottom:0;padding:0}
nav.tabs{display:flex;flex-direction:column;gap:2px;flex:1}
nav.tabs button{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;border-radius:8px;padding:0 10px;min-height:38px;font:500 15px Barlow,sans-serif;color:var(--ink);text-align:left;cursor:pointer}
nav.tabs button:hover{background:var(--bg)}
.ngb{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:0 10px;margin-top:6px;font:600 15px Barlow,sans-serif;color:var(--ink)}
nav.tabs button.ngb{font-weight:600;min-height:40px}.ngb.so{cursor:default}
.nic{width:20px;height:20px;display:grid;place-items:center;color:var(--muted);flex:none}.nt{flex:1;min-width:0}
.nch{color:var(--muted);display:grid;place-items:center;flex:none}
.nlv{margin-left:19px;padding-left:10px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:1px}.nlv .nlv{margin-left:12px}
nav.tabs .nit[aria-current="true"]{background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
nav.tabs .nit.pai{color:var(--brand-ink);font-weight:600}
.nbadge{min-width:22px;height:20px;padding:0 7px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-size:12px;font-weight:700;display:grid;place-items:center}
.who{display:flex;align-items:center;gap:10px;padding:12px 6px 0;border-top:1px solid var(--line)}
.av{width:36px;height:36px;border-radius:50%;background:var(--brand-ink);color:var(--surface);display:grid;place-items:center;font:600 14px Barlow,sans-serif;flex:none}
.wn{display:flex;flex-direction:column;flex:1;min-width:0}.wn b{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wn small{font-size:13px;color:var(--muted)}
.wic{width:40px;height:40px;border:0;border-radius:8px;background:none;color:var(--muted);display:grid;place-items:center;cursor:pointer;flex:none}.wic:hover{background:var(--bg);color:var(--ink)}
.shell{margin-left:272px;min-width:0}
.mbar{display:none}
.scrim{display:none}
@media(max-width:900px){
 .side{transform:translateX(-100%);transition:transform .2s ease;box-shadow:0 0 40px rgba(0,0,0,.2)}
 body.menu .side{transform:none}
 body.menu .scrim{display:block;position:fixed;inset:0;background:rgba(10,14,11,.45);z-index:20}
 .shell{margin-left:0}
 .mbar{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 12px}
 .mbar strong{font:600 19px "Barlow Condensed",sans-serif}
 .mbar .icon{font-size:22px;padding:4px 10px}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}
main{max-width:1480px;margin:0 auto;padding:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.stack>*+*{margin-top:16px}
.grid2{display:grid;gap:16px;align-items:start}
@media(min-width:960px){.grid2{grid-template-columns:minmax(0,5fr) minmax(0,6fr)}.grid2.even{grid-template-columns:1fr 1fr}}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end;margin-bottom:12px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.muted{color:var(--muted)}p{margin:4px 0}
.inp{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-height:40px;width:100%}
.tools .inp{width:auto;min-width:180px}
textarea.inp{resize:vertical}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;min-height:40px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:transparent;border-style:dashed;color:var(--muted)}
.btn.wide{width:100%}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13.5px}
.roiitems{max-height:220px;overflow:auto;margin-top:8px}
details.roi{margin-top:4px}details.roi summary{cursor:pointer;font-weight:600;color:var(--info)}
.wsteps{display:flex;gap:6px;margin:12px 0 14px;overflow-x:auto}
.wsteps button{flex:1;display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;font-size:14px}
.wsteps span{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-size:12.5px;flex:none}
.wsteps .cur{border-color:var(--brand);color:var(--ink)}.wsteps .cur span{background:var(--brand);color:var(--on-brand)}
.wsteps .done span{background:var(--brand-soft);color:var(--brand-ink)}
.kanban{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;padding-bottom:10px}
@media(max-width:1180px){.kanban{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:640px){.kanban{grid-template-columns:1fr}}
.kcol{min-width:0}.khead{padding:8px 9px}.khead h3{font-size:16.5px;align-items:flex-start}.kbody{padding:6px;gap:6px}
.kcard{padding:8px 9px;overflow-wrap:anywhere}.kcard b{font-size:16px}.kcard small{font-size:12.5px}.kcard .chip{font-size:11.5px;padding:2px 7px;white-space:normal}
.kcol{background:var(--surface);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:240px;scroll-snap-align:start}
.khead{padding:10px 12px;border-bottom:1px solid var(--line);border-top:4px solid var(--line);border-radius:10px 10px 0 0}
.khead h3{font-size:18px;display:flex;justify-content:space-between;gap:8px}.khead small{color:var(--muted);font-size:13px}
.kcol.fase .khead{border-top-color:var(--brand)}.kcol.fim .khead{border-top-color:var(--brand-ink)}
.kbody{padding:8px;display:grid;gap:8px;align-content:start;flex:1;background:var(--bg);border-radius:0 0 10px 10px}
.kcard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 11px;cursor:pointer}
.kcard:hover{border-color:var(--brand)}
.kcard b{font:600 17px "Barlow Condensed",sans-serif}.kcard span,.kcard small{display:block}.kcard small{color:var(--muted);font-size:13px}
.kmeta{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.kempty{color:var(--muted);font-size:13.5px;text-align:center;padding:16px 6px}
.ffs{display:grid;gap:6px;margin-top:8px}.ff{border:1px solid var(--line);border-radius:8px;padding:8px 10px}.ff b{display:block;font-weight:600}.ff span{font-size:13.5px;color:var(--muted)}
.ff.ok{background:var(--brand-soft);border-color:transparent}.ff.ok b,.ff.ok span{color:var(--brand-ink)}
.ff.go{border:2px solid var(--brand)}.ff.go span{color:var(--brand-ink);font-weight:600}

.phases div{border:1px solid var(--line);border-radius:8px;padding:8px 10px}.phases span{display:block;font-size:13px;color:var(--muted)}.phases b{font:600 20px "Barlow Condensed",sans-serif}
.lsub{margin:16px 0 6px;font-size:17px}
.note{background:var(--info-soft);color:var(--info);border-radius:8px;padding:8px 10px;font-size:14px;margin:0 0 12px}
.dayhead{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.dayhead .inp{width:auto}
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item b{font-weight:600}.item small{display:block;color:var(--muted)}
.item .right{display:flex;gap:6px;align-items:center;flex:none}
.late{border-left:3px solid var(--warn);padding-left:10px}
.campo{max-width:680px;margin:0 auto}
.chips{display:flex;gap:6px;margin:14px 0 10px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;cursor:pointer;color:var(--muted)}
.chips button[aria-current="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.acard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.acard:hover{border-color:var(--brand)}
.ah{display:flex;justify-content:space-between;gap:8px;align-items:center}
.ah b{font:600 19px "Barlow Condensed",sans-serif}
.acard span,.acard small{display:block}.acard small{color:var(--muted)}
.back{background:none;border:0;color:var(--muted);font-weight:600;cursor:pointer;padding:12px 0 8px}
.track{display:flex;gap:4px;margin:12px 0 4px}.track div{flex:1;height:6px;border-radius:3px;background:var(--line)}
.track .done{background:var(--brand)}.track .cur{background:var(--brand);opacity:.45}
.tlabels{display:flex;gap:4px;font-size:11.5px;color:var(--muted)}.tlabels span{flex:1;text-align:center}
.info{display:grid;gap:10px;margin:14px 0;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.info a{color:var(--info);font-weight:600}
.acts{display:grid;gap:10px}
.bigbtn{width:100%;min-height:66px;font:600 24px "Barlow Condensed",sans-serif;border-radius:12px;background:var(--brand);color:var(--on-brand);border:0;cursor:pointer;letter-spacing:.02em}
.bigbtn:active{transform:scale(.99)}
.rels{display:grid;gap:8px}
.relbtn{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px dashed var(--muted);background:var(--surface);border-radius:10px;padding:14px;cursor:pointer;text-align:left;font-weight:600}
.relbtn small{color:var(--muted);font-weight:500}.relbtn.done{border-style:solid;border-color:var(--brand);background:var(--brand-soft)}.relbtn.done small{color:var(--brand-ink)}
.result{border-radius:10px;padding:12px 14px;background:var(--bg)}
.result.warn{background:var(--warn-soft);color:var(--warn)}
.result.ok{background:var(--brand-soft);color:var(--brand-ink)}.result.bad{background:var(--bad-soft);color:var(--bad)}
.tl{display:grid;gap:0}.tl div{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.tl div:last-child{border-bottom:0}.tl b{font:600 17px "Barlow Condensed",sans-serif}.tl small{display:block;color:var(--muted)}.tl .off{color:var(--muted)}
.lpu{border:1px solid var(--line);border-radius:10px;padding:12px}
.lrow{display:grid;grid-template-columns:1fr 80px;gap:6px 8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.lrow .lv{grid-column:1;font-weight:600;color:var(--muted)}.lrow .icon{justify-self:end}
.ltotal{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;padding-top:10px;border-top:2px solid var(--ink)}
.ltotal b{font:600 26px "Barlow Condensed",sans-serif}
.sum3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.sum3 div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.sum3 span{font-size:13px;color:var(--muted);display:block}.sum3 b{font:600 21px "Barlow Condensed",sans-serif}
@media(max-width:520px){.sum3{grid-template-columns:1fr}}
.lcard{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--surface);overflow:hidden}
.lhead{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:none;border:0;padding:12px 14px;text-align:left;cursor:pointer}
.lhead span,.lhead small{display:block}.lhead small{color:var(--muted)}.lhead b{font-weight:600}
.val{font:600 22px "Barlow Condensed",sans-serif;white-space:nowrap}
.lbody{padding:0 14px 14px;border-top:1px solid var(--line)}
.hist{font-size:13.5px;color:var(--muted);margin-top:10px}.hist div{padding:3px 0}
.modal{position:fixed;inset:0;background:rgba(10,14,11,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.open{display:flex}
.sheetm{background:var(--surface);width:100%;max-width:580px;max-height:90%;overflow:auto;border-radius:14px 14px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px))}
@media(min-width:700px){.modal{align-items:center}.sheetm{border-radius:14px}}
.sheetm.wide{max-width:900px}
.placeholder{border:2px dashed var(--line);border-radius:10px;padding:22px 16px;text-align:center;color:var(--muted);margin:12px 0}
.placeholder b{display:block;color:var(--ink);font:600 18px "Barlow Condensed",sans-serif;margin-bottom:4px}
.doc{border:1px solid var(--line);border-radius:8px;padding:16px}
.dochead{display:flex;gap:10px;align-items:center;padding-bottom:10px;margin-bottom:12px;border-bottom:3px solid var(--brand)}
.dochead b{display:block;font:600 19px "Barlow Condensed",sans-serif}.dochead small{color:var(--muted)}
footer{max-width:1480px;margin:8px auto 24px;padding:0 16px;display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:13px;align-items:center}
.link{background:none;border:0;color:var(--info);font-weight:600;cursor:pointer;padding:0;text-decoration:underline}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:11px 16px;border-radius:10px;font-weight:600;z-index:30;max-width:calc(100% - 32px);display:none;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#toast.bad{background:var(--bad);color:#fff}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* ---------- PREVISÃO DOS PROJETOS ---------- */
const util=iso=>{let d=iso;while([0,6].includes(new Date(d+'T12:00:00').getDay()))d=addD(d,1);return d};
const addUteis=(iso,n)=>{let d=iso;for(let k=0;k<n;k++)d=util(addD(d,1));return d};
function previsao(p){
  const T=hoje();let cur=T;const out={};
  for(const f of FASES){
    if(naoAplica(p,f.k)){out[f.k]={tipo:'na'};continue}
    const pv=+p[f.p]||0,fin=faseFim(p.etiqueta,f.k);
    if(fin){out[f.k]={tipo:'ok',ini:fin.data,fim:fin.data,tec:fin.tec,pv,real:realDias(p.etiqueta,f.k)};if(fin.data>cur)cur=fin.data;continue}
    const ab=S.ags.filter(a=>a.etiqueta===p.etiqueta&&fasesOf(a).includes(f.k)&&!FIM.includes(a.status)&&a.status!=='cancelada').sort((a,b)=>a.data.localeCompare(b.data))[0];
    const resta=Math.max(1,pv-realDias(p.etiqueta,f.k));
    if(ab){const ini=ab.data<T?T:ab.data,fim=addUteis(ini,resta-1);out[f.k]={tipo:ab.data<T?'atr':'ag',ini:ab.data,fim,pv,tec:ab.tec};cur=fim>cur?fim:cur;continue}
    if(!pv&&f.k!=='ativ'){out[f.k]={tipo:'sem'};continue}
    out[f.k]={tipo:'prev',pv};
  }
  out.entregue=out.ativ.tipo==='ok';out.entrega=['ok','ag','atr'].includes(out.ativ.tipo)?out.ativ.fim:null;
  return out;
}
function prevCell(c){const per=(a,b)=>a===b?dBR(a).slice(0,5):`${dBR(a).slice(0,5)} a ${dBR(b).slice(0,5)}`;

    case 'na':return '<div class="pc na"><b>N/A</b><small>não se aplica</small></div>';
    case 'sem':return '<div class="pc na"><b>Sem previsão</b><small>informe os dias</small></div>';
    case 'ok':return `<div class="pc ok"><b>✓ ${dBR(c.fim).slice(0,5)}</b><small>${c.real} / ${c.pv} dias, ${esc(tecN(c.tec))}</small></div>`;
    case 'ag':return `<div class="pc"><b>${per(c.ini,c.fim)}</b><small>agendada, ${c.pv} dia(s), ${esc(tecN(c.tec))}</small></div>`;
    case 'atr':return `<div class="pc warn"><b>${per(c.ini,c.fim)}</b><small>atrasada desde ${dBR(c.ini).slice(0,5)}</small></div>`;
    default:return `<div class="pc na"><b>Sem agendamento</b><small>previsão de ${c.pv||1} dia(s)</small></div>`}}

/* ---------- ESTOQUE / MATERIAL ---------- */
const pontaItem=i=>{const t=(i.tipo||'').toUpperCase();if(t.includes('PONTA A'))return 'A';if(t.includes('PONTA B'))return 'B';return CABO_RE.test(i.desc||'')?'A':'B'};
const pontaUsada=(g,fases)=>g==='A'?fases.some(k=>k==='rua'||k==='interno'||k==='ext'):fases.includes('ativ');
const estDe=(tec,it)=>{const E=S.estoque[tec]||{};if(it.cod&&E[it.cod])return E[it.cod];return Object.values(E).find(x=>normK(x.desc)===normK(it.desc))||null};
function necessidade(p,fases){if(!p||!p.roi)return [];const need={};
  p.roi.itens.filter(i=>!isMO(i)&&pontaUsada(pontaItem(i),fases)).forEach(i=>{const k=i.cod||'d:'+normK(i.desc);need[k]=need[k]||{cod:i.cod,desc:i.desc,qtd:0,ponta:pontaItem(i)};need[k].qtd+=+i.qtd||0});return Object.values(need)}
function comprometido(tec,exceto){const por={};S.ags.filter(a=>a.tec===tec&&a.etiqueta!==exceto&&['agendada','deslocamento','no_local','execucao'].includes(a.status)).forEach(a=>{const g=por[a.etiqueta]=por[a.etiqueta]||{fs:new Set(),mats:null};fasesOf(a).forEach(k=>g.fs.add(k));if(a.materiais){g.mats=g.mats||{};a.materiais.forEach(m=>{const k=mKey(m);g.mats[k]=Math.max(g.mats[k]||0,+m.qtd||0)})}});
  const out={};Object.entries(por).forEach(([e,g])=>{if(g.mats)Object.entries(g.mats).forEach(([k,q])=>{out[k]=(out[k]||0)+q});else necessidade(pPor(e),[...g.fs]).forEach(n=>{const k=mKey(n);out[k]=(out[k]||0)+n.qtd})});return out}
const mKey=n=>n.cod||'d:'+normK(n.desc);
function matCheck(p,tec,fases,lista){if(!p||!tec||(!lista&&(!p.roi||!fases.length)))return null;const cmp=comprometido(tec,p.etiqueta);
  return (lista||necessidade(p,fases)).map(n=>{const e=estDe(tec,n),b=e?+e.bolsao||0:0,v=e?+e.elleven||0:0,c=cmp[n.cod||'d:'+normK(n.desc)]||0,disp=b+v-c;return Object.assign({},n,{bolsao:b,elleven:v,comp:c,disp,st:disp>=n.qtd?'ok':disp>0?'parcial':'falta'})})}
function matHtml(L,tecView){if(L===null)return '';if(!L.length)return '<div class="mat"><div class="mh"><b>Material</b><span class="muted">Sem material do ROI para estas fases.</span></div></div>';

   <table><thead><tr><th>Material</th><th class="r">Precisa</th><th class="r">Bolsão</th><th class="r">${lab}</th>${tecView?'':'<th class="r">Em outros agend.</th>'}<th class="r">Disponível</th><th></th></tr></thead><tbody>${L.map(x=>`<tr><td>${esc(x.desc)}<br><small class="muted">${[x.cod,'Ponta '+x.ponta].filter(Boolean).map(esc).join(', ')}</small></td><td class="r">${x.qtd.toLocaleString('pt-BR')}</td><td class="r">${x.bolsao.toLocaleString('pt-BR')}</td><td class="r">${x.elleven.toLocaleString('pt-BR')}</td>${tecView?'':`<td class="r">${x.comp?x.comp.toLocaleString('pt-BR'):'—'}</td>`}<td class="r"><b>${Math.max(0,x.disp).toLocaleString('pt-BR')}</b></td><td>${x.st==='ok'?'<span class="chip ok">Tem</span>':x.st==='parcial'?`<span class="chip warn">Faltam ${(x.qtd-Math.max(0,x.disp)).toLocaleString('pt-BR')}</span>`:'<span class="chip bad">Não tem</span>'}</td></tr>`).join('')}</tbody></table></div>`}

const IDB={p:null,open(){if(!this.p)this.p=new Promise((res,rej)=>{try{const r=indexedDB.open('impl_anexos',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});return this.p},
  async tx(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('f',mode),st=t.objectStore('f'),rq=fn(st);t.oncomplete=()=>res(rq&&rq.result);t.onerror=()=>rej(t.error)})},
  put(k,v){return this.tx('readwrite',s=>s.put(v,k))},get(k){return this.tx('readonly',s=>s.get(k))},del(k){return this.tx('readwrite',s=>s.delete(k))}};

const roiTable=itens=>{const tp=itens.some(i=>i.tipo),un=itens.some(i=>i.un);return `<div class="tablewrap roiitems"><table><thead><tr><th>Item</th>${tp?'<th>Tipo</th>':''}<th class="r">Qtd</th>${un?'<th>Un.</th>':''}</tr></thead><tbody>${itens.map(i=>`<tr><td style="white-space:normal">${esc(i.desc)}</td>${tp?`<td>${esc(i.tipo||'')}</td>`:''}<td class="r">${(+i.qtd||0).toLocaleString('pt-BR')}</td>${un?`<td>${esc(i.un||'')}</td>`:''}</tr>`).join('')}</tbody></table></div>`};
function detectTopo(txt){const achados=TOPO_RULES.filter(t=>t[2].test(txt)).map(t=>t[1]);const rb=RB_RE.test(txt);const regra=TOPO_RULES.find(t=>t[2].test(txt));if(rb)achados.push('RB');return{achados,topologia:regra?regra[0]:(rb?'Last mile':null)}}
const ROI_LABELS={'cliente':'cliente','protocolo':'protocolo','etiqueta':'etiqueta','valor mensal':'valor','taxa de instalacao':'taxa','custo total':'custoTotal','roi':'roiIdx','custo mao de obra':'custoMO','valor materiais':'valorMat','custos adicionais':'custosAdic'};
const ROI_NUM=['valor','taxa','custoTotal','roiIdx','custoMO','valorMat','custosAdic'];
const labelKey=t=>ROI_LABELS[normK(String(t||'')).replace(/^\*\s*/,'').replace(/[:\s]+$/,'')];
function finishFields(o){const r={};Object.entries(o).forEach(([k,v])=>{r[k]=ROI_NUM.includes(k)?num(v):String(v).trim()});return r}
function headerFields(lines){

    if(m&&labelKey(m[1])){o[labelKey(m[1])]??=m[2];return}
    const k=labelKey(l);if(k&&L[i+1]&&!labelKey(L[i+1])&&!(L[i+1].split('\t').length>1))o[k]??=L[i+1]});

function formFields(rows){

function roiFromLines(lines,nome){

async function pdfRead(buf){
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;const lines=[],rowsOut=[];
  for(let n=1;n<=pdf.numPages;n++){const pg=await pdf.getPage(n),tc=await pg.getTextContent(),rows={};
    tc.items.forEach(it=>{if(!it.str||!it.str.trim())return;const y=Math.round(it.transform[5]/3)*3;(rows[y]=rows[y]||[]).push({x:it.transform[4],w:it.width||0,s:it.str})});
    Object.keys(rows).map(Number).sort((a,b)=>b-a).forEach(y=>{const cells=[];rows[y].sort((a,b)=>a.x-b.x).forEach(i=>{const last=cells[cells.length-1];const g=last?i.x-last.end:99;
      if(last&&g<3.5){last.s+=(g>1?' ':'')+i.s;last.end=i.x+i.w}else cells.push({x:i.x,end:i.x+i.w,s:i.s})});
      cells.forEach(c=>c.s=c.s.replace(/\s+/g,' ').trim());rowsOut.push(cells);lines.push(cells.map(c=>c.s).join('\t'))})}
  return{lines,rows:rowsOut};
}
function tableFromPdf(rows){
  const isQ=c=>/^(qtd|qtde|quant)/i.test(c),isD=c=>/descri|material|produto|equipamento/i.test(c);
  const hi=rows.findIndex(r=>r.some(c=>isQ(c.s))&&r.some(c=>isD(c.s)));if(hi<0)return null;
  const H=rows[hi].slice().sort((a,b)=>a.x-b.x),span=H.map((c,i)=>[c.x-3,i+1<H.length?H[i+1].x-3:1e9]);
  const out=[H.map(c=>c.s)];
  rows.slice(hi+1).forEach(r=>{const cells=H.map(()=>[]);r.forEach(c=>{let best=0,bo=-1e9;span.forEach(([a,b],k)=>{const o=Math.min(c.end,b)-Math.max(c.x,a);if(o>bo){bo=o;best=k}});cells[best].push(c.s)});out.push(cells.map(x=>x.join(' ')))});
  return out;
}
function roiFromPdf(rd,nome){const t=tableFromPdf(rd.rows);const r=roiFromLines(rd.lines,nome);Object.assign(r,formFields(rd.rows));if(t)Object.assign(r,roiFromRows(t));return r}
function roiFromRows(rows){
  rows=rows.map(r=>r.map(c=>String(c??'').trim())).filter(r=>r.some(Boolean));
  const isQ=c=>/^(qtd|qtde|quant)/i.test(c),isD=c=>/descri|item|material|produto|equipamento/i.test(c);
  const hi=rows.findIndex(r=>r.some(isQ)&&r.some(isD));let qi=-1,di=-1,ui2=-1;
  if(hi>=0){const h=rows[hi];qi=h.findIndex(isQ);di=h.findIndex(c=>/descri/i.test(c));if(di<0)di=h.findIndex(isD);ui2=h.findIndex(c=>/^(un|und|unid|unidade)\b/i.test(c));var ti=h.findIndex(c=>/^tipo$/i.test(c)),ci=h.findIndex(c=>/c[oó]digo/i.test(c))}
  const itens=[];
  rows.slice(hi+1).forEach(r=>{let desc,qtd=0,un='';
    let tipo='',cod='';if(hi>=0){desc=r[di]||'';qtd=num(r[qi]);un=ui2>=0?r[ui2]||'':'';tipo=ti>=0?r[ti]||'':'';cod=ci>=0?(r[ci]||'').trim():''}
    else{const line=r.join(' ');const m=line.match(/(\d+(?:[.,]\d+)*)\s*(km|mts?|metros?|m)\b/i);
      if(m){qtd=num(m[1]);un=/km/i.test(m[2])?'km':'m'}else{const n=r.find(c=>/^\d+(?:[.,]\d+)*$/.test(c));if(n)qtd=num(n)}
      desc=r.filter(c=>!/^\d+(?:[.,]\d+)*$/.test(c)).join(' ')}
    if(/[a-zà-ú]/i.test(desc))itens.push({cod:/^[A-Z]{2,4}\d{4,}$/.test(cod)?cod:'',desc,qtd,un,tipo})});
  const{achados,topologia}=detectTopo(itens.map(i=>i.desc).join(' \n '));

}

    doc.autoTable({startY:y,theme:'grid',margin:{left:m,right:m},head:[['Cód.','Descrição','Fator','Med.','V. Unit','Qtd','Total']],body:it.map(i=>[i.cod,i.desc,i.fator||'Comum',i.medida||'',brl(i.unit),String(i.qtd).replace('.',','),brl(i.unit*i.qtd)]),
      foot:[[{content:'Subtotal '+c,colSpan:6,styles:{halign:'right'}},brl(sub)]],headStyles:{fillColor:[140,191,63],fontSize:7},bodyStyles:{fontSize:7},footStyles:{fillColor:[244,249,236],textColor:[90,130,30],fontSize:8},styles:{cellPadding:2,lineColor:[212,221,216],lineWidth:.3}});y=doc.lastAutoTable.finalY+5});
  doc.setFontSize(12);doc.setFont('helvetica','bold');doc.setTextColor(90,130,30);doc.text('TOTAL GERAL: '+brl(l.total),W-m,y+5,{align:'right'});y+=14;
  if(y+40>H-20){doc.addPage();y=30}
  if(l.assinatura){try{doc.addImage(l.assinatura.img,'PNG',m+5,y,70,24)}catch(e){}}
  y+=27;doc.setDrawColor(0);doc.setLineWidth(.3);doc.line(m,y,90,y);doc.line(120,y,W-m,y);doc.setFontSize(8);doc.setFont('helvetica','normal');doc.setTextColor(107,117,133);
  doc.text(l.assinatura?`${l.assinatura.nome}, ${dtBR(l.assinatura.em)}`:'Assinatura prestador',52.5,y+5,{align:'center'});doc.text('Aprovador',157.5,y+5,{align:'center'});
  const n=doc.internal.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(7);doc.setTextColor(170);doc.text('Net Turbo Telecom, LPU '+l.etiqueta,m,H-8);doc.text(`Página ${i} de ${n}`,W-m,H-8,{align:'right'})}
  return doc.output('blob')}
// ---- usuários e acessos (coordenador)
let USR=null;
async function carregarUsuarios(){const[pf,pp]=await Promise.all([todas(()=>sb.from('perfis').select('id,nome,tipo,cnpj,status,equipe').order('nome')),todas(()=>sb.from('agenda_papeis').select('*'))]);USR={pf,pp}}
const PAPEIS=[['','Sem acesso à agenda'],['coordenador','Coordenador'],['supervisor','Supervisor'],['encarregado','Encarregado'],['tecnico:clt','Técnico próprio (CLT)'],['tecnico:terceiro','Técnico terceiro']];
function viewUsuarios(){if(!USR){carregarUsuarios().then(render).catch(e=>toast(e.message,'bad'));return '<p class="muted pad">Carregando usuários…</p>'}
  const pap=id=>{const x=USR.pp.find(p=>p.user_id===id&&p.ativo);return x?(x.papel==='tecnico'?'tecnico:'+x.vinculo:x.papel):''};
  const pend=USR.pf.filter(p=>p.status==='pendente'),q=normK(ui.uQ||''),apr=USR.pf.filter(p=>p.status==='aprovado'&&(!q||normK(p.nome+' '+(p.equipe||'')).includes(q))&&(!ui.uSo||pap(p.id)||(p.equipe||'').toLowerCase().includes('implanta')));
  return `<div class="toolbar"><div><h2>Usuários e acessos</h2><p class="muted">Os cadastros são os mesmos do Estoque de Materiais. Aqui você aprova cadastros novos e define quem acessa a agenda e com qual papel.</p></div></div>
   ${pend.length?`<section class="panel" style="margin-bottom:14px"><h3>Cadastros aguardando aprovação</h3>${pend.map(p=>`<div class="item"><div><b>${esc(p.nome)}</b><small>${p.tipo==='tecnico'?'Técnico, '+esc(p.cnpj||''):'Gestão'}</small></div><div class="right"><button class="btn sm" data-act="uRej" data-id="${p.id}">Recusar</button><button class="btn sm primary" data-act="uApr" data-id="${p.id}">Aprovar</button></div></div>`).join('')}</section>`:''}
   <div class="tools" style="margin-bottom:10px"><input class="inp" type="search" id="uQ" placeholder="Buscar nome ou equipe" data-in="uQ" value="${esc(ui.uQ||'')}"><label class="chk" style="margin:0"><input type="checkbox" data-ch="uSo" ${ui.uSo?'checked':''}> Só Implantação e quem já tem acesso</label></div>
   <div class="tablewrap"><table><thead><tr><th>Nome</th><th>Cadastro</th><th>Equipe</th><th>Acesso à agenda</th></tr></thead><tbody>${apr.map(p=>`<tr><td><b>${esc(p.nome)}</b>${p.cnpj?`<br><small class="muted">${esc(p.cnpj)}</small>`:''}</td><td>${p.tipo==='tecnico'?'Técnico':p.tipo==='om'?'Gestão O&M':esc(p.tipo)}</td><td>${esc(p.equipe||'—')}</td><td><select class="inp" style="min-width:190px" data-ch="uPapel" data-id="${p.id}" ${p.id===ME.id?'disabled':''}>${PAPEIS.map(([v,n])=>`<option value="${v}" ${pap(p.id)===v?'selected':''}>${n}</option>`).join('')}</select></td></tr>`).join('')||'<tr><td colspan="4" class="muted">Nenhum usuário encontrado.</td></tr>'}</tbody></table></div>`}
// ---- sessão
let RECUP=/type=recovery/.test(location.hash),NP_OPEN=RECUP,BOOT_UID=null;
async function checarSessao(){if(NP_OPEN)return;
  const{data:{session}}=await sb.auth.getSession();if(!session){BOOT_UID=null;ME=null;showAuth('cLogin');return}
  if(BOOT_UID===session.user.id)return;
  $('vLoad').classList.remove('hidden');$('vAuth').classList.add('hidden');
  const{data:pf}=await sb.from('perfis').select('*').eq('id',session.user.id).maybeSingle();
  if(!pf){showAuth('cPend');$('pendMsg').textContent='Seu cadastro não foi encontrado. Crie a conta novamente ou fale com a coordenação.';return}
  if(pf.status!=='aprovado'){showAuth('cPend');$('pendMsg').textContent=pf.status==='rejeitado'?'Seu cadastro foi recusado. Fale com a coordenação.':'Seu cadastro está aguardando aprovação da coordenação.';return}
  const{data:pp}=await sb.from('agenda_papeis').select('*').eq('user_id',session.user.id).eq('ativo',true).maybeSingle();
  if(!pp){showAuth('cPend');$('pendMsg').textContent='Seu cadastro está aprovado, mas o acesso à Agenda de Implantação ainda não foi liberado pela coordenação.';return}
  ME={id:session.user.id,nome:pf.nome,cnpj:pf.cnpj,papel:pp.papel,vinculo:pp.vinculo};
  ui.perfil={coordenador:'coord',supervisor:'sup',encarregado:'enc',tecnico:pp.vinculo==='terceiro'?'terc':'clt'}[pp.papel];ui.tab=PERFIS[ui.perfil].tabs[0];ui.tec=ME.id;
  try{await carregar()}catch(e){$('loadMsg').textContent='Erro ao carregar os dados: '+(e.message||e);return}
  BOOT_UID=session.user.id;document.body.classList.add('app-on');
  const qs=new URLSearchParams(location.search),agLink=qs.get('ag'),relVolta=qs.get('rel');if(agLink){history.replaceState(null,'',location.pathname);const a=getAg(agLink);if(a){if(['clt','terc'].includes(ui.perfil)){ui.tab='campo';ui.campoSel=a.id}else ui.tab='agenda'}}
  render();ligarTempoReal();if(agLink&&getAg(agLink)&&!['clt','terc'].includes(ui.perfil))ACT.agOpen({dataset:{id:agLink}});
  if(relVolta&&agLink&&getAg(agLink)){const a=getAg(agLink);checarRelatorio(a).then(ok=>{render();toast(ok?'Relatório recebido. Agora é só encerrar a atividade.':'O PDF ainda não chegou à agenda. Toque em "Verificar relatório" em alguns segundos.',ok?'':'bad')})}
  if(pushOk()&&Notification.permission==='granted')assinarPush().catch(()=>{});
}
function ligarTempoReal(){if(RT)sb.removeChannel(RT);let t;const rec=()=>{clearTimeout(t);t=setTimeout(async()=>{if(SYNC_PEND||$('modal').classList.contains('open'))return;await SYNC_P;try{await carregar();render()}catch(e){}},800)};
  RT=sb.channel('agenda').on('postgres_changes',{event:'*',schema:'public',table:'ag_agendamentos'},rec).on('postgres_changes',{event:'*',schema:'public',table:'ag_lpus'},rec).subscribe()}
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState!=='visible'||!ME||SYNC_PEND||$('modal').classList.contains('open'))return;await SYNC_P;try{await carregar();
  const a=ui.campoSel&&getAg(ui.campoSel);if(a&&a.status==='relatorios'&&relsDe(a).some(r=>!a.rel||!a.rel[r.k]))await checarRelatorio(a);render()}catch(e){}});
Object.assign(ACT,{
  authCard:el=>showAuth(el.dataset.c),
  login:async()=>{aErr('lgErr','');const{error}=await sb.auth.signInWithPassword({email:$('lgEmail').value.trim(),password:$('lgSenha').value});if(error)aErr('lgErr','E-mail ou senha inválidos.')},
  logout:async()=>{await flushSync();await sb.auth.signOut();location.hash='';location.reload()},
  signup:async()=>{aErr('suErr','');const nome=$('suNome').value.trim(),tipo=$('suTipo').value,cnpj=docN($('suDoc').value),email=$('suEmail').value.trim(),senha=$('suSenha').value;
    if(!nome||!email||senha.length<6||(tipo==='tecnico'&&!cnpj)){aErr('suErr','Preencha todos os campos (senha com 6 ou mais caracteres).');return}
    const{data,error}=await sb.auth.signUp({email,password:senha});if(error){aErr('suErr',error.message);return}
    const{error:pe}=await sb.from('perfis').insert({id:data.user.id,nome,tipo,cnpj:tipo==='tecnico'?cnpj:null,status:'pendente'});if(pe){aErr('suErr',pe.message);return}BOOT_UID=null;checarSessao()},
  forgot:async()=>{const email=$('fgEmail').value.trim();if(!email){$('fgMsg').textContent='Informe o e-mail.';return}const{error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});$('fgMsg').textContent=error?'Não foi possível enviar agora: '+error.message:'Se o e-mail estiver cadastrado, enviamos um link para redefinir a senha. Confira também o spam.'},
  chPass:()=>{NP_OPEN=true;showAuth('cNewPass');$('npTitle').textContent='Alterar senha';$('npCancel').classList.remove('hidden')},
  npCancel:()=>{NP_OPEN=false;document.body.classList.add('app-on');$('vAuth').classList.add('hidden')},
  newPass:async()=>{const a=$('np1').value,b=$('np2').value;if(a.length<6)return aErr('npErr','A senha precisa ter ao menos 6 caracteres.');if(a!==b)return aErr('npErr','As duas senhas não são iguais.');
    const{error}=await sb.auth.updateUser({password:a});if(error)return aErr('npErr',/session/i.test(error.message)?'O link expirou ou já foi usado. Peça um novo em "Esqueci minha senha".':error.message);
    const rec=RECUP;RECUP=false;NP_OPEN=false;history.replaceState(null,'',location.pathname);alert('Senha alterada com sucesso.');if(rec){BOOT_UID=null;checarSessao()}else{document.body.classList.add('app-on');$('vAuth').classList.add('hidden')}},
  uApr:async el=>{const r=await sb.from('perfis').update({status:'aprovado'}).eq('id',el.dataset.id);if(r.error){toast('Erro: '+r.error.message,'bad');return}toast('Cadastro aprovado. Defina o acesso à agenda na lista.');await carregarUsuarios();render()},
  uRej:async el=>{if(!confirm('Recusar este cadastro?'))return;const r=await sb.from('perfis').update({status:'rejeitado'}).eq('id',el.dataset.id);if(r.error){toast('Erro: '+r.error.message,'bad');return}await carregarUsuarios();render()}
});
Object.assign(CH,{
  suTipo:el=>$('suDocW').classList.toggle('hidden',el.value!=='tecnico'),
  uSo:el=>{ui.uSo=el.checked;render()},
  uPapel:async el=>{const id=el.dataset.id,[papel,vinculo]=el.value.split(':');let r;
    if(!papel)r=await sb.from('agenda_papeis').delete().eq('user_id',id);else r=await sb.from('agenda_papeis').upsert({user_id:id,papel,vinculo:vinculo||null,ativo:true},{onConflict:'user_id'});
    if(r.error){toast('Erro: '+r.error.message,'bad');await carregarUsuarios();render();return}toast('Acesso atualizado.');await carregarUsuarios();if(papel==='tecnico'||!papel){await carregar()}render()}
});
Object.assign(IN,{uQ:el=>{ui.uQ=el.value;render();const i=$('uQ');i.focus();const n=i.value.length;try{i.setSelectionRange(n,n)}catch(e){}}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!document.body.classList.contains('app-on')){if(!$('cLogin').classList.contains('hidden'))ACT.login()}});
if(RECUP){showAuth('cNewPass');$('npTitle').textContent='Definir nova senha'}
if(/error_code=otp_expired|error=access_denied/.test(location.hash)){history.replaceState(null,'',location.pathname);showAuth('cForgot');$('fgMsg').textContent='Esse link expirou ou já foi usado. Peça um novo abaixo.'}
sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){RECUP=true;NP_OPEN=true;showAuth('cNewPass');return}checarSessao()});
checarSessao();
</script>
