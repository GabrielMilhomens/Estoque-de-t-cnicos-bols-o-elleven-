<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Espaço de armazenamento</title>
<link rel="icon" type="image/png" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#F2F4F0;--surface:#FFFFFF;--ink:#1D2620;--muted:#5D6A61;--line:#D8DED4;--brand:#8CBF3F;--brand-ink:#2E5410;--brand-soft:#E6F1D5;--warn:#9A6414;--warn-soft:#FBEFD9;--bad:#A8352B;--bad-soft:#F8E0DC}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;gap:12px;align-items:center}
header a{color:var(--brand-ink);font-weight:600;text-decoration:none}
main{max-width:920px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}
h2{font-size:16px;margin:0 0 8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.muted{color:var(--muted)}
.bar{height:12px;background:#E9ECE6;border-radius:6px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--brand)}
.bar.alto i{background:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 4px;word-break:break-word;border-bottom:1px solid var(--line);text-align:left}
td.n,th.n{text-align:right;white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#1B3209}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.aviso{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 12px;margin:8px 0}
.erro{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:10px 12px;margin:8px 0}
.ok{background:var(--brand-soft);color:var(--brand-ink);border-radius:8px;padding:10px 12px;margin:8px 0}
label.chk{display:flex;gap:6px;align-items:center}
select,input{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.lt td{vertical-align:middle}.lt small{display:block;color:var(--muted)}
.chip{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap;background:#E9ECE6;color:var(--muted)}
.chip.zip{background:var(--warn-soft);color:var(--warn)}.chip.feito{background:var(--brand-soft);color:var(--brand-ink)}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.btn.del{background:var(--bad);border-color:var(--bad);color:#fff}
.reg{padding-left:18px;margin:6px 0 0}.reg li{margin:3px 0;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.mbox{background:var(--surface);border-radius:12px;max-width:460px;width:100%;padding:18px}.mbox h3{margin:0 0 8px}
.mbox input{width:100%;margin:6px 0 4px}
@media(max-width:640px){.lt thead{display:none}.lt,.lt tbody,.lt tr,.lt td{display:block;width:100%}.lt tr{border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin-bottom:8px}.lt td{border:0;padding:4px 0;text-align:left}.lt td.n{text-align:left}.lt td[data-l]::before{content:attr(data-l)': ';color:var(--muted)}.acts{justify-content:flex-start}}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><a href="agenda.html">← Voltar para a agenda</a><h1>Espaço de armazenamento</h1></header>
<main id="app"><p class="muted">Carregando…</p></main>
<script>
const sb = supabase.createClient('https://ksatofcjlqziqhblpwul.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtzYXRvZmNqbHF6aXFoYmxwd3VsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3NTA3NTIsImV4cCI6MjEwNTMyNjc1Mn0.IOAHnOcxVdrP1gBD7nCoQ6wq1mB-dEYVJQIM_WiJaqc');
const LIM_ARQ = 100 * 1024 ** 3, LIM_BANCO = 8 * 1024 ** 3;   // plano Pro: 100 GB de arquivos (organização), 8 GB de banco por projeto
const MAXPX = 1280, QUAL = 0.6, MIN_BYTES = 350 * 1024;    // mesmo padrão das fotos novas da agenda
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = b => b >= 1024 ** 3 ? (b / 1024 ** 3).toFixed(2) + ' GB' : b >= 1024 ** 2 ? (b / 1024 ** 2).toFixed(1) + ' MB' : Math.round(b / 1024) + ' KB';
let USO = [], RODANDO = false, PARAR = false, ARQ = null, LOG = null, LOGERR = '', MES = '', LST = {}, OCUP = false;

async function iniciar() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $('app').innerHTML = '<div class="panel"><p>Entre na agenda com o seu usuário e volte para esta tela.</p><a class="btn primary" href="agenda.html">Abrir a agenda</a></div>'; return; }
  await carregar();
}

async function carregar() {
  const { data, error } = await sb.rpc('ag_uso_armazenamento');
  if (error) {
    $('app').innerHTML = `<div class="panel"><div class="erro">${/Somente/.test(error.message) ? 'Esta tela é só do coordenador.' : 'Não foi possível ler o uso: ' + esc(error.message) + '. Confira se o ajuste 13 foi rodado no Supabase.'}</div></div>`;
    return;
  }
  USO = data || [];
  const [a, l] = await Promise.all([sb.rpc('ag_arquivos', { p_bucket: 'agenda', p_min: 0 }), sb.from('ag_limpezas').select('*').order('em', { ascending: false }).limit(60)]);
  ARQ = a.error ? [] : (a.data || []);
  LOG = l.error ? [] : (l.data || []); LOGERR = l.error ? 'Rode o ajuste 27 (agenda_ajuste_27_limpeza_armazenamento.sql) no Supabase para guardar o registro das limpezas.' : '';
  desenhar();
}

function desenhar() {
  const total = USO.reduce((s, r) => s + Number(r.bytes), 0), banco = Number(USO[0]?.banco || 0);
  const porBucket = {};
  USO.forEach(r => { (porBucket[r.bucket] = porBucket[r.bucket] || { arquivos: 0, bytes: 0, pastas: [] }); porBucket[r.bucket].arquivos += Number(r.arquivos); porBucket[r.bucket].bytes += Number(r.bytes); porBucket[r.bucket].pastas.push(r) });
  const barra = (v, lim) => `<div class="bar ${v > lim * .9 ? 'alto' : ''}"><i style="width:${Math.min(100, v / lim * 100).toFixed(1)}%"></i></div>`;
  const falta = total - LIM_ARQ;
  $('app').innerHTML = `
  <section class="panel">
    <h2>Uso do plano Pro — projeto estoque de materiais</h2>
    <div class="grid">
      <div><b>Arquivos</b> <span class="muted">${fmt(total)} de 100 GB</span>${barra(total, LIM_ARQ)}</div>
      <div><b>Banco de dados</b> <span class="muted">${fmt(banco)} de 8 GB</span>${barra(banco, LIM_BANCO)}</div>
    </div>
    ${falta > 0 ? `<div class="aviso">Só este projeto já passa do limite em ${fmt(falta)}. Compacte as fotos abaixo (os arquivos continuam no mesmo lugar, só ficam menores).</div>` : `<div class="ok">Este projeto ocupa ${fmt(total)}.</div>`}
    <p class="muted" style="margin:0">Os 100 GB de arquivos são da organização Netturbo inteira: somam este projeto e o projeto de preventivas e agendamentos (agendamento-fotos, preventivas-pdfs), que tem retenção automática de 30 dias. Acima disso o Supabase cobra por GB excedente, se o limite de gastos estiver desligado. O painel do Supabase atualiza o número com algumas horas de atraso.</p>
  </section>
  <section class="panel">
    <h2>Onde está o espaço</h2>
    <table><thead><tr><th>Bucket</th><th>Pasta</th><th class="n">Arquivos</th><th class="n">Tamanho</th></tr></thead><tbody>
    ${USO.map(r => `<tr><td>${esc(r.bucket)}</td><td>${esc(r.pasta)}</td><td class="n">${r.arquivos}</td><td class="n">${fmt(Number(r.bytes))}</td></tr>`).join('')}
    </tbody></table>
  </section>
  <section class="panel" id="limp"></section>
  <section class="panel">
    <h2>Compactar fotos</h2>
    <p class="muted">Cada foto acima de ${fmt(MIN_BYTES)} é baixada, reduzida para ${MAXPX} px no lado maior e regravada no mesmo caminho. Os links e relatórios da agenda continuam funcionando. PDFs não são alterados. A foto só é trocada se ficar pelo menos 20% menor.</p>
    <div class="row">
      ${Object.keys(porBucket).filter(b => b === 'agenda').map(b => `<label class="chk"><input type="checkbox" class="bk" value="${esc(b)}" checked> ${esc(b)} (${fmt(porBucket[b].bytes)})</label>`).join('')}
    </div>
    <div class="row" style="margin-top:10px"><button class="btn primary" id="bComp">Compactar</button><button class="btn" id="bParar" hidden>Parar</button></div>
    <div id="prog" hidden><div class="bar"><i id="pBar" style="width:0"></i></div><p id="pTxt" class="muted"></p></div>
  </section>`;
  limpDesenhar();
  $('bComp').onclick = compactar;
  $('bParar').onclick = () => { PARAR = true; $('bParar').disabled = true };
}

function reduzir(blob) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(blob), img = new Image();
    img.onload = () => {
      const r = Math.min(1, MAXPX / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('falha ao gerar a imagem')), 'image/jpeg', QUAL);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('imagem inválida')) };
    img.src = url;
  });
}

async function compactar() {
  if (RODANDO) return;
  const buckets = [...document.querySelectorAll('.bk:checked')].map(x => x.value);
  if (!buckets.length) return;
  RODANDO = true; PARAR = false;
  $('bComp').disabled = true; $('bParar').hidden = false; $('bParar').disabled = false; $('prog').hidden = false;
  const lista = [];
  for (const b of buckets) {
    const { data, error } = await sb.rpc('ag_arquivos', { p_bucket: b, p_min: MIN_BYTES });
    if (error) { $('pTxt').textContent = 'Erro ao listar ' + b + ': ' + error.message; RODANDO = false; $('bComp').disabled = false; return; }
    (data || []).filter(f => /^image\//.test(f.tipo || '') || /\.(jpe?g|png|webp)$/i.test(f.nome)).forEach(f => lista.push({ bucket: b, ...f }));
  }
  let feitos = 0, trocados = 0, liberado = 0, erros = 0;
  const atualiza = () => { $('pBar').style.width = (lista.length ? feitos / lista.length * 100 : 100) + '%'; $('pTxt').textContent = `${feitos} de ${lista.length} fotos verificadas · ${trocados} compactadas · ${fmt(liberado)} liberados${erros ? ' · ' + erros + ' com erro' : ''}` };
  atualiza();
  let i = 0;
  const trabalhador = async () => {
    while (i < lista.length && !PARAR) {
      const f = lista[i++];
      try {
        const { data: blob, error } = await sb.storage.from(f.bucket).download(f.nome);
        if (error) throw error;
        const nova = await reduzir(blob);
        if (nova.size < blob.size * 0.8) {
          const { error: e2 } = await sb.storage.from(f.bucket).upload(f.nome, nova, { upsert: true, contentType: 'image/jpeg', cacheControl: '3600' });
          if (e2) throw e2;
          trocados++; liberado += blob.size - nova.size;
        }
      } catch (e) { erros++; console.warn(f.nome, e) }
      feitos++; atualiza();
    }
  };
  await Promise.all([trabalhador(), trabalhador(), trabalhador()]);
  RODANDO = false;
  $('pTxt').textContent += PARAR ? ' · interrompido' : ' · concluído';
  const txt = $('pTxt').textContent;
  await carregar();
  $('prog').hidden = false; $('pBar').style.width = '100%'; $('pTxt').textContent = txt;
}

/* ---------- 14/10: baixar o mês em ZIP e liberar o espaço ----------
   Só arquivos do bucket agenda. Os dados da ferramenta (chamados, atividades, horários, indicadores, LPUs, textos do chat) continuam.
   Apagar só fica liberado depois de baixar o ZIP daquele mês e tipo, e apaga só os arquivos que entraram no ZIP. */
const TIPOS = [
  { k: 'chat', nome: 'Fotos e arquivos do chat', d: 'Chat com técnico, chat da atividade e Chat com NOC' },
  { k: 'foto', nome: 'Fotos dos relatórios da Implantação', d: 'Fotos das etapas e do resumo de cada dia' },
  { k: 'gtd',  nome: 'Fotos do atendimento do GTD', d: 'Fotos do RFO' },
  { k: 'rel',  nome: 'PDFs de relatório e RFO', d: 'Relatórios fotográficos, de entrega e do RFO' },
  { k: 'lpu',  nome: 'PDFs de LPU assinados', d: 'Valores e itens da LPU continuam na ferramenta' },
  { k: 'kmz',  nome: 'KMZ e anexos dos projetos', d: 'KMZ de lançamento e extensão e outros anexos' },
  { k: 'out',  nome: 'Outros arquivos', d: 'Fora das pastas acima' }];
const ZIP_PARTE = 700 * 1024 ** 2;
const MESF = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Sao_Paulo', year: 'numeric', month: '2-digit' });
const mesDe = t => MESF.format(new Date(t)).slice(0, 7);
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const mesNome = m => { const [a, b] = m.split('-'); return MESES[+b - 1].replace(/^./, c => c.toUpperCase()) + '/' + a };
const nArq = q => q + (q === 1 ? ' arquivo' : ' arquivos');
const tipoNome = k => (TIPOS.find(t => t.k === k) || { nome: k }).nome;
function tipoDe(f) {
  const n = f.nome, img = /^image\//.test(f.tipo || '') || /\.(jpe?g|png|webp|gif|heic)$/i.test(n), pdf = /pdf/i.test(f.tipo || '') || /\.pdf$/i.test(n);
  if (n.startsWith('lpus/')) return 'lpu';
  if (n.startsWith('anexos/')) return 'kmz';
  if (/^chat\/g\/[^/]+\/rfo\//.test(n)) return img ? 'gtd' : 'rel';
  if (n.startsWith('chat/')) return 'chat';
  if (n.startsWith('relatorios/')) return pdf ? 'rel' : 'foto';
  return 'out';
}
function grupos() {
  const atual = mesDe(Date.now()), G = {};
  (ARQ || []).forEach(f => { if (!f.criado) return; const m = mesDe(f.criado); if (m >= atual) return; const k = tipoDe(f);
    ((G[m] = G[m] || {})[k] = G[m][k] || []).push(f) });
  return G;
}
function limpDesenhar() {
  const el = $('limp'); if (!el) return;
  const G = grupos(), meses = Object.keys(G).sort().reverse();
  if (!MES || !G[MES]) MES = meses[0] || '';
  const L = MES ? G[MES] : {};
  let livre = 0;
  const linhas = TIPOS.filter(t => L[t.k] && L[t.k].length).map(t => {
    const F = L[t.k], q = F.length, b = F.reduce((s, f) => s + Number(f.bytes || 0), 0), e = LST[MES + t.k];
    livre += b;
    const chip = e && e.ok ? `<span class="chip zip">ZIP baixado · ${nArq(e.ok.length)}${e.falhas ? ' · ' + e.falhas + ' não baixaram' : ''}</span>` : '<span class="chip">No armazenamento</span>';
    const acts = `<button class="btn ${e && e.ok ? '' : 'primary'}" data-zip="${t.k}" ${OCUP ? 'disabled' : ''}>${e && e.ok ? 'Baixar de novo' : 'Baixar ZIP'}</button>`
      + `<button class="btn ${e && e.ok && e.ok.length ? 'del' : ''}" data-del="${t.k}" ${e && e.ok && e.ok.length && !OCUP ? '' : 'disabled title="Baixe o ZIP primeiro"'}>Apagar</button>`;
    return `<tr><td><b>${esc(t.nome)}</b><small>${esc(t.d)}</small></td><td class="n" data-l="Arquivos">${q}</td><td class="n" data-l="Tamanho">${fmt(b)}</td><td>${chip}</td><td><div class="acts">${acts}</div></td></tr>`;
  }).join('');
  el.innerHTML = `<h2>Baixar e liberar espaço por mês</h2>
    <div class="ok"><b>Fica sempre na ferramenta:</b> chamados, atividades, horários, indicadores, LPUs com valores e itens, backlog, textos do chat e histórico. Aqui saem só os arquivos (fotos, anexos, KMZ e PDFs). Quem abrir um arquivo apagado vê o aviso de que ele está no ZIP da coordenação.</div>
    ${meses.length ? `<div class="row" style="margin:10px 0"><label for="limpMes"><b>Mês</b></label><select id="limpMes">${meses.map(m => `<option value="${m}" ${m === MES ? 'selected' : ''}>${mesNome(m)}</option>`).join('')}</select><span class="muted">${livre ? 'Dá para liberar até ' + fmt(livre) + ' neste mês' : ''}</span></div>
    <p class="muted" style="margin:0 0 8px">O mês corrente não aparece. Primeiro baixe o ZIP (acima de 700 MB ele vem em partes) e guarde num lugar seguro, como o Drive da empresa; depois o Apagar fica liberado e apaga só os arquivos que entraram no ZIP.</p>
    <table class="lt"><thead><tr><th>Tipo de arquivo</th><th class="n">Arquivos</th><th class="n">Tamanho</th><th>Situação</th><th class="n">Ações</th></tr></thead><tbody>${linhas || '<tr><td colspan="5" class="muted">Nada guardado neste mês.</td></tr>'}</tbody></table>`
    : '<p class="muted">Não há arquivos de meses anteriores ao mês corrente.</p>'}
    <div id="lProg" hidden><div class="bar"><i id="lBar" style="width:0"></i></div><p id="lTxt" class="muted"></p></div>
    <h2 style="margin-top:14px">Registro de limpezas</h2>
    ${LOGERR ? `<div class="aviso">${esc(LOGERR)}</div>` : ''}
    ${LOG && LOG.length ? `<ul class="reg">${LOG.map(x => `<li>${x.em ? new Date(x.em).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }) + ' · ' : ''}${x.por_nome ? esc(x.por_nome) + ' · ' : ''}${esc(mesNome(x.mes))} · ${esc(tipoNome(x.tipo))} · ${nArq(x.arquivos)} · ${fmt(Number(x.bytes))} liberados</li>`).join('')}</ul>` : (LOGERR ? '' : '<p class="muted" style="margin:0">Nenhuma limpeza feita ainda.</p>')}`;
  const s = $('limpMes'); if (s) s.onchange = () => { MES = s.value; limpDesenhar() };
  el.querySelectorAll('[data-zip]').forEach(b => b.onclick = () => baixarZip(b.dataset.zip));
  el.querySelectorAll('[data-del]').forEach(b => b.onclick = () => confirmarApagar(b.dataset.del));
}
let JSZIP_P = null;
const jszip = () => JSZIP_P || (JSZIP_P = new Promise((ok, er) => { if (window.JSZip) return ok(window.JSZip); const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'; sc.onload = () => window.JSZip ? ok(window.JSZip) : er(new Error('JSZip indisponível')); sc.onerror = () => { JSZIP_P = null; er(new Error('não foi possível carregar o gerador de ZIP')) }; document.head.appendChild(sc) }));
function salvar(blob, nome) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 60000) }
async function baixarZip(k) {
  if (OCUP) return; const F = (grupos()[MES] || {})[k] || []; if (!F.length) return;
  let JSZip; try { JSZip = await jszip() } catch (e) { alert(e.message); return }
  OCUP = true; limpDesenhar(); $('lProg').hidden = false;
  const ok = [], base = `agenda_arquivos_${MES}_${k}`;
  let zip = new JSZip(), noZip = 0, parte = 1, feitos = 0, falhas = 0, i = 0, fila = Promise.resolve();
  const txt = m => { $('lBar').style.width = (feitos / F.length * 100) + '%'; $('lTxt').textContent = m || `${tipoNome(k)} · ${mesNome(MES)}: ${feitos} de ${F.length} arquivos baixados${falhas ? ' · ' + falhas + ' com erro' : ''}` };
  const fechar = async ult => { if (!noZip) return; txt(`Gerando o ZIP${ult && parte === 1 ? '' : ' (parte ' + parte + ')'}…`); const b = await zip.generateAsync({ type: 'blob', compression: 'STORE' }); salvar(b, ult && parte === 1 ? base + '.zip' : `${base}_parte${parte}.zip`); parte++; zip = new JSZip(); noZip = 0 };
  const trab = async () => { while (i < F.length) { const f = F[i++];
    try { const { data, error } = await sb.storage.from('agenda').download(f.nome); if (error) throw error;
      fila = fila.then(async () => { zip.file(f.nome, data); noZip += data.size; ok.push(f.nome); if (noZip >= ZIP_PARTE) await fechar(false) }); await fila;
    } catch (e) { falhas++; console.warn(f.nome, e) }
    feitos++; txt() } };
  try { await Promise.all([trab(), trab(), trab()]); await fila; await fechar(true) }
  catch (e) { alert('Não foi possível gerar o ZIP: ' + e.message); OCUP = false; limpDesenhar(); return }
  LST[MES + k] = { ok, falhas, bytes: F.filter(f => ok.includes(f.nome)).reduce((s, f) => s + Number(f.bytes || 0), 0), partes: parte - 1 };
  OCUP = false; limpDesenhar(); $('lProg').hidden = false; $('lBar').style.width = '100%';
  $('lTxt').textContent = `ZIP baixado: ${nArq(ok.length)}${parte - 1 > 1 ? ' em ' + (parte - 1) + ' partes' : ''}${falhas ? ' · ' + falhas + ' não baixaram e não serão apagados' : ''}. Confira o arquivo no seu computador antes de apagar.`;
}
function confirmarApagar(k) {
  const e = LST[MES + k]; if (!e || !e.ok.length || OCUP) return;
  const m = document.createElement('div'); m.className = 'modal'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true');
  m.innerHTML = `<div class="mbox"><h3>Apagar arquivos</h3><p><b>${esc(tipoNome(k))}</b> de <b>${mesNome(MES)}</b>: ${nArq(e.ok.length)}, ${fmt(e.bytes)}.</p>
    <div class="erro">Não tem como desfazer. Depois de apagados, esses arquivos só existem no ZIP que você baixou.</div>
    <label for="lConf">Para confirmar, digite <b>APAGAR</b></label><input id="lConf" autocomplete="off">
    <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn" id="lNao">Cancelar</button><button class="btn del" id="lSim" disabled>Apagar e liberar espaço</button></div></div>`;
  document.body.appendChild(m); const inp = m.querySelector('#lConf'), sim = m.querySelector('#lSim'); inp.focus();
  inp.oninput = () => sim.disabled = inp.value.trim().toUpperCase() !== 'APAGAR';
  m.querySelector('#lNao').onclick = () => m.remove();
  sim.onclick = async () => { m.remove(); await apagar(k) };
}
async function apagar(k) {
  const e = LST[MES + k]; OCUP = true; limpDesenhar(); $('lProg').hidden = false;
  let feitos = 0, erros = 0;
  for (let j = 0; j < e.ok.length; j += 100) {
    const lote = e.ok.slice(j, j + 100), { error } = await sb.storage.from('agenda').remove(lote);
    if (error) { erros += lote.length; console.warn(error) } else feitos += lote.length;
    $('lBar').style.width = ((j + lote.length) / e.ok.length * 100) + '%'; $('lTxt').textContent = `Apagando: ${feitos} de ${e.ok.length}${erros ? ' · ' + erros + ' com erro' : ''}`;
  }
  const bytes = feitos === e.ok.length ? e.bytes : Math.round(e.bytes * feitos / e.ok.length);
  let aviso = '';
  if (feitos) { const r = await sb.from('ag_limpezas').insert({ mes: MES, tipo: k, arquivos: feitos, bytes, zip: `agenda_arquivos_${MES}_${k}` + (e.partes > 1 ? ` (${e.partes} partes)` : '') + '.zip' }); if (r.error) aviso = ' O registro não foi gravado: rode o ajuste 27.' }
  delete LST[MES + k]; OCUP = false; const msg = `${feitos} arquivos apagados · ${fmt(bytes)} liberados${erros ? ' · ' + erros + ' não foram apagados (tente de novo)' : ''}.${aviso}`;
  await carregar(); $('lProg').hidden = false; $('lBar').style.width = '100%'; $('lTxt').textContent = msg;
}
