.brand small{font:600 13px Barlow,sans-serif;color:var(--muted);letter-spacing:.02em}.acard .brand{border-bottom:0;padding:0}
nav.tabs{display:flex;flex-direction:column;gap:2px;flex:1}
nav.tabs button{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;border-radius:8px;padding:0 10px;min-height:38px;font:500 15px Barlow,sans-serif;color:var(--ink);text-align:left;cursor:pointer}
nav.tabs button:hover{background:var(--bg)}
.ngb{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:0 10px;margin-top:6px;font:600 15px Barlow,sans-serif;color:var(--ink)}
nav.tabs button.ngb{font-weight:600;min-height:40px}.ngb.so{cursor:default}
.nic{width:20px;height:20px;display:grid;place-items:center;color:var(--muted);flex:none}.nt{flex:1;min-width:0}
.nch{color:var(--muted);display:grid;place-items:center;flex:none}
.nlv{margin-left:19px;padding-left:10px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:1px}.nlv .nlv{margin-left:12px}
nav.tabs .nit[aria-current="true"]{background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
nav.tabs .nit.pai{color:var(--brand-ink);font-weight:600}
.nbadge{min-width:22px;height:20px;padding:0 7px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-size:12px;font-weight:700;display:grid;place-items:center}
.who{display:flex;align-items:center;gap:10px;padding:12px 6px 0;border-top:1px solid var(--line)}
.av{width:36px;height:36px;border-radius:50%;background:var(--brand-ink);color:var(--surface);display:grid;place-items:center;font:600 14px Barlow,sans-serif;flex:none}
.wn{display:flex;flex-direction:column;flex:1;min-width:0}.wn b{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wn small{font-size:13px;color:var(--muted)}
.wic{width:40px;height:40px;border:0;border-radius:8px;background:none;color:var(--muted);display:grid;place-items:center;cursor:pointer;flex:none}.wic:hover{background:var(--bg);color:var(--ink)}
.shell{margin-left:272px;min-width:0}
.mbar{display:none}
.scrim{display:none}
@media(max-width:900px){
 .side{transform:translateX(-100%);transition:transform .2s ease;box-shadow:0 0 40px rgba(0,0,0,.2)}
 body.menu .side{transform:none}
 body.menu .scrim{display:block;position:fixed;inset:0;background:rgba(10,14,11,.45);z-index:20}
 .shell{margin-left:0}
 .mbar{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 12px}
 .mbar strong{font:600 19px "Barlow Condensed",sans-serif}
 .mbar .icon{font-size:22px;padding:4px 10px}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}
main{max-width:1480px;margin:0 auto;padding:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.stack>*+*{margin-top:16px}
.grid2{display:grid;gap:16px;align-items:start}
@media(min-width:960px){.grid2{grid-template-columns:minmax(0,5fr) minmax(0,6fr)}.grid2.even{grid-template-columns:1fr 1fr}}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end;margin-bottom:12px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.muted{color:var(--muted)}p{margin:4px 0}
.inp{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-height:40px;width:100%}
.tools .inp{width:auto;min-width:180px}
textarea.inp{resize:vertical}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;min-height:40px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:transparent;border-style:dashed;color:var(--muted)}
.btn.wide{width:100%}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13.5px}
.roiitems{max-height:220px;overflow:auto;margin-top:8px}
details.roi{margin-top:4px}details.roi summary{cursor:pointer;font-weight:600;color:var(--info)}
.wsteps{display:flex;gap:6px;margin:12px 0 14px;overflow-x:auto}
.wsteps button{flex:1;display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;font-size:14px}
.wsteps span{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-size:12.5px;flex:none}
.wsteps .cur{border-color:var(--brand);color:var(--ink)}.wsteps .cur span{background:var(--brand);color:var(--on-brand)}
.wsteps .done span{background:var(--brand-soft);color:var(--brand-ink)}
.kanban{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;padding-bottom:10px}
@media(max-width:1180px){.kanban{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:640px){.kanban{grid-template-columns:1fr}}
.kcol{min-width:0}.khead{padding:8px 9px}.khead h3{font-size:16.5px;align-items:flex-start}.kbody{padding:6px;gap:6px}
.kcard{padding:8px 9px;overflow-wrap:anywhere}.kcard b{font-size:16px}.kcard small{font-size:12.5px}.kcard .chip{font-size:11.5px;padding:2px 7px;white-space:normal}
.kcol{background:var(--surface);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:240px;scroll-snap-align:start}
.khead{padding:10px 12px;border-bottom:1px solid var(--line);border-top:4px solid var(--line);border-radius:10px 10px 0 0}
.khead h3{font-size:18px;display:flex;justify-content:space-between;gap:8px}.khead small{color:var(--muted);font-size:13px}
.kcol.fase .khead{border-top-color:var(--brand)}.kcol.fim .khead{border-top-color:var(--brand-ink)}
.kbody{padding:8px;display:grid;gap:8px;align-content:start;flex:1;background:var(--bg);border-radius:0 0 10px 10px}
.kcard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 11px;cursor:pointer}
.kcard:hover{border-color:var(--brand)}
.kcard b{font:600 17px "Barlow Condensed",sans-serif}.kcard span,.kcard small{display:block}.kcard small{color:var(--muted);font-size:13px}
.kmeta{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.kempty{color:var(--muted);font-size:13.5px;text-align:center;padding:16px 6px}
.ffs{display:grid;gap:6px;margin-top:8px}.ff{border:1px solid var(--line);border-radius:8px;padding:8px 10px}.ff b{display:block;font-weight:600}.ff span{font-size:13.5px;color:var(--muted)}
.ff.ok{background:var(--brand-soft);border-color:transparent}.ff.ok b,.ff.ok span{color:var(--brand-ink)}
.ff.go{border:2px solid var(--brand)}.ff.go span{color:var(--brand-ink);font-weight:600}

/* ---------- PREVISÃO DOS PROJETOS ---------- */
const util=iso=>{let d=iso;while([0,6].includes(new Date(d+'T12:00:00').getDay()))d=addD(d,1);return d};
const addUteis=(iso,n)=>{let d=iso;for(let k=0;k<n;k++)d=util(addD(d,1));return d};
function previsao(p){
  const T=hoje();let cur=T;const out={};
  for(const f of FASES){
    if(naoAplica(p,f.k)){out[f.k]={tipo:'na'};continue}
    const pv=+p[f.p]||0,fin=faseFim(p.etiqueta,f.k);
    if(fin){out[f.k]={tipo:'ok',ini:fin.data,fim:fin.data,tec:fin.tec,pv,real:realDias(p.etiqueta,f.k)};if(fin.data>cur)cur=fin.data;continue}
    const ab=S.ags.filter(a=>a.etiqueta===p.etiqueta&&fasesOf(a).includes(f.k)&&!FIM.includes(a.status)&&a.status!=='cancelada').sort((a,b)=>a.data.localeCompare(b.data))[0];
    const resta=Math.max(1,pv-realDias(p.etiqueta,f.k));
    if(ab){const ini=ab.data<T?T:ab.data,fim=addUteis(ini,resta-1);out[f.k]={tipo:ab.data<T?'atr':'ag',ini:ab.data,fim,pv,tec:ab.tec};cur=fim>cur?fim:cur;continue}
    if(!pv&&f.k!=='ativ'){out[f.k]={tipo:'sem'};continue}
    out[f.k]={tipo:'prev',pv};
  }
  out.entregue=out.ativ.tipo==='ok';out.entrega=['ok','ag','atr'].includes(out.ativ.tipo)?out.ativ.fim:null;
  return out;
}

/* ---------- BACKLOG (KANBAN) ----------
   Só projetos da base ainda não entregues (sem ativação finalizada), em três colunas: Lançamento externo,
   Lançamento interno e Ativação. Cada projeto fica na primeira dessas fases que falta; a extensão de sinal
   aparece no card e na coluna Ativação como etapa anterior. Entregues saem do backlog. */
const KCOLS=[['rua','Lançamento externo'],['interno','Lançamento interno'],['ativ','Ativação']];
const fasesAplic=p=>fasesProj(p);
function etapa(p){if(!p||!p.etiqueta)return 'rua';if(faseFim(p.etiqueta,'ativ'))return 'entregue';
  const req=fasesReq(p).map(f=>f.k);return ['rua','interno'].find(k=>req.includes(k)&&!faseFim(p.etiqueta,k))||'ativ'}
const kLancado=e=>S.ags.filter(a=>a.etiqueta===e&&a.status!=='cancelada').reduce((s,a)=>s+(metrosAg(a)||0),0);
function kTrab(p){const req=fasesReq(p).map(f=>f.k),pend=k=>req.includes(k)&&!faseFim(p.etiqueta,k),temCabo=pend('rua')||pend('interno');
  const metros=+p.metros||0,lanc=kLancado(p.etiqueta),falta=temCabo?Math.max(0,metros-lanc):0,ext=req.includes('ext'),cx=ext?(+p.caixas||0):0;
  const dias=fasesProj(p).map(f=>({k:f.k,pv:+p[f.p]||0,r:realDias(p.etiqueta,f.k),fin:!!faseFim(p.etiqueta,f.k)}));
  return{metros,lanc,falta,temCabo,ext,cx,cxPend:ext&&pend('ext')?cx:0,dias,diasPend:dias.filter(d=>!d.fin).reduce((s,d)=>s+Math.max(0,d.pv-d.r),0)}}
const kM=v=>(+v||0).toLocaleString('pt-BR');
function viewKanban(){
  const q=ui.kQ.toLowerCase(),cids=[...new Set(S.previsao.map(p=>p.cidade).filter(Boolean))].sort();
  const L=S.previsao.filter(p=>p.etiqueta&&etapa(p)!=='entregue'&&(!q||[p.etiqueta,p.protocolo,p.cliente,p.pop].join(' ').toLowerCase().includes(q))&&(!ui.kCid||p.cidade===ui.kCid));
  const g={};KCOLS.forEach(([k])=>g[k]=[]);const T={};L.forEach(p=>{const k=etapa(p);g[k].push(p);T[p.id]=kTrab(p)});
  const card=(p,k)=>{const x=S.ags.filter(a=>a.etiqueta===p.etiqueta&&a.status!=='cancelada'),t=T[p.id],meta=[];
    const ab=x.filter(a=>!FIM.includes(a.status)&&fasesOf(a).some(f=>!isExtra(f))).sort((a,b)=>a.data.localeCompare(b.data))[0];
    const falta=[!(S.comp[p.etiqueta]||{}).endereco&&'Sem endereço',!p.pop&&!p.equip&&'Sem dados técnicos',!(+p.dRua||+p.dInterno||+p.dAtiv)&&'Sem previsão de dias'].filter(Boolean);
    let linha=ab?`${ST[ab.status][0]}: ${fasesC(ab)}, ${dBR(ab.data)}, ${tecN(ab.tec)}`:x.length?'Aguardando agendamento da próxima fase':falta.length?'Cadastro incompleto':'Pronto para agendar';
    if(!x.length)falta.forEach(f=>meta.push(`<span class="chip warn">${f}</span>`));if(ab&&ab.data<hoje())meta.push('<span class="chip warn">Atrasada</span>');
    const atual=t.dias.find(d=>d.k===k);if(atual&&atual.r>atual.pv)meta.push('<span class="chip bad">Acima do previsto</span>');
    // fases anteriores na coluna Ativação
    let ant='';if(k==='ativ'){const prev=t.dias.filter(d=>d.k!=='ativ'),pend=prev.filter(d=>!d.fin);
      ant=prev.length?`<div class="kant ${pend.length?'warn':'ok'}">${pend.length?`Fases pendentes: ${pend.map(d=>FCURTO[d.k].toLowerCase()).join(', ')}`:'Fases anteriores concluídas'}</div>`:'<div class="kant ok">Sem fases anteriores (ativa direto)</div>';
      if(liberado(p))meta.unshift('<span class="chip go">Liberado para ativar</span>')}
    const temLanc=t.dias.some(d=>d.k==='rua'||d.k==='interno');
    const trab=[t.temCabo?`<div><span>Cabo</span><b>${kM(t.falta)} m</b>${t.lanc?`<small>de ${kM(t.metros)} m, ${kM(t.lanc)} m lançados</small>`:`<small>a lançar</small>`}</div>`:`<div><span>Cabo</span><b>—</b><small>${temLanc?'lançamento concluído':'sem lançamento'}</small></div>`,
      t.ext?`<div><span>Extensão</span><b>${t.cx} ${t.cx===1?'caixa':'caixas'}</b><small>${t.cxPend?'a fazer':'concluída'}</small></div>`:'<div><span>Extensão</span><b>—</b><small>sem extensão</small></div>'].join('');
    const dias=t.dias.map(d=>`<span class="kd ${d.fin?'fin':d.k===k?'cur':''}${d.r>d.pv&&d.pv?' over':''}" title="${faseN(d.k)}: ${d.r} de ${d.pv} dia(s) previstos${d.fin?', finalizada':''}">${d.fin?'✓ ':''}${FCURTO[d.k]} <b>${d.fin||d.r?d.r+'/':''}${d.pv}d</b></span>`).join('');
    return `<button class="kcard" data-act="kOpen" data-etq="${esc(p.etiqueta)}" data-k="${k}"><b>${esc(p.etiqueta)}</b><span>${esc(p.cliente)}</span><small>${esc([p.cidade,p.topologia].filter(Boolean).join(', '))}${p.semRua?', sem rua':''}${p.semExt?', sem extensão':''}</small>
      <div class="ktrab">${trab}</div><div class="kdias">${dias}</div>${ant}<small class="klin">${esc(linha)}</small>${meta.length?`<div class="kmeta">${meta.join('')}</div>`:''}</button>`};
  const tot=L.map(p=>T[p.id]),soma=f=>tot.reduce((s,t)=>s+f(t),0);
  const colInfo=k=>{const P=g[k].map(p=>T[p.id]);if(k==='ativ'){const d=g[k].reduce((s,p)=>s+Math.max(0,(+p.dAtiv||0)-realDias(p.etiqueta,'ativ')),0);return `${d} ${d===1?'dia previsto':'dias previstos'} de ativação`}
    const m=P.reduce((s,t)=>s+t.falta,0),d=g[k].reduce((s,p)=>{const f=FASES.find(x=>x.k===k);return s+Math.max(0,(+p[f.p]||0)-realDias(p.etiqueta,k))},0);return `${kM(m)} m de cabo, ${d} ${d===1?'dia previsto':'dias previstos'}`};
  return `<div class="toolbar"><div><h2>Backlog de projetos</h2><p class="muted">O que falta fazer: ${L.length} projeto(s) da base ainda não entregues. Cada projeto fica na próxima fase a executar e sai do backlog quando a ativação é finalizada. Toque em um card para abrir na agenda.</p></div>
   <div class="tools"><input class="inp" type="search" id="kQ" placeholder="Buscar etiqueta, cliente ou POP" data-in="kQ" value="${esc(ui.kQ)}"><select class="inp" data-ch="kCid"><option value="">Todas as cidades</option>${cids.map(c=>`<option ${c===ui.kCid?'selected':''}>${esc(c)}</option>`).join('')}</select></div></div>
   <div class="kpis" style="margin-bottom:12px">${kp(L.length,'Projetos a entregar')}${kp(kM(soma(t=>t.falta))+' m','Cabo a lançar')}${kp(soma(t=>t.cxPend),'Caixas de extensão a fazer')}${kp(soma(t=>t.diasPend),'Dias de campo previstos (restantes)')}</div>
   <div class="kanban k3">${KCOLS.map(([k,n])=>`<section class="kcol fase"><div class="khead"><h3>${n}<span class="chip">${g[k].length}</span></h3><small>${colInfo(k)}</small></div><div class="kbody">${g[k].map(p=>card(p,k)).join('')||'<p class="kempty">Nenhum projeto aqui.</p>'}</div></section>`).join('')}</div>`;
}

/* ---------- ESTOQUE / MATERIAL ---------- */
const pontaItem=i=>{const t=(i.tipo||'').toUpperCase();if(t.includes('PONTA A'))return 'A';if(t.includes('PONTA B'))return 'B';return CABO_RE.test(i.desc||'')?'A':'B'};
const INT_ITEM=i=>/terminador|extensao\s*optica/.test(normK(i.desc||''));
const pontaUsada=(g,fases)=>g==='A'?fases.some(k=>k==='rua'||k==='interno'||k==='ext'):fases.includes('ativ');
const estDe=(tec,it)=>{const E=S.estoque[tec]||{};if(it.cod&&E[it.cod])return E[it.cod];return Object.values(E).find(x=>normK(x.desc)===normK(it.desc))||null};
function necessidade(p,fases){if(!p||!p.roi)return [];const need={};
  const temInt=fasesReq(p).some(f=>f.k==='interno'),noInt=i=>temInt&&INT_ITEM(i);
  p.roi.itens.filter(i=>!isMO(i)&&(noInt(i)?fases.includes('interno'):pontaUsada(pontaItem(i),fases))).forEach(i=>{const k=i.cod||'d:'+normK(i.desc);need[k]=need[k]||{cod:i.cod,desc:i.desc,qtd:0,ponta:pontaItem(i)+(noInt(i)?', vai no lançamento interno':'')};need[k].qtd+=+i.qtd||0});return Object.values(need)}
function comprometido(tec,exceto){const por={};S.ags.filter(a=>a.tec===tec&&a.etiqueta!==exceto&&['agendada','deslocamento','no_local','execucao'].includes(a.status)).forEach(a=>{const g=por[a.etiqueta]=por[a.etiqueta]||{fs:new Set(),mats:null};fasesOf(a).forEach(k=>g.fs.add(k));if(a.materiais){g.mats=g.mats||{};a.materiais.forEach(m=>{const k=mKey(m);g.mats[k]=Math.max(g.mats[k]||0,+m.qtd||0)})}});
  const out={};Object.entries(por).forEach(([e,g])=>{if(g.mats)Object.entries(g.mats).forEach(([k,q])=>{out[k]=(out[k]||0)+q});else necessidade(pPor(e),[...g.fs]).forEach(n=>{const k=mKey(n);out[k]=(out[k]||0)+n.qtd})});return out}
const mKey=n=>n.cod||'d:'+normK(n.desc);
function matCheck(p,tec,fases,lista){if(!p||!tec||(!lista&&(!p.roi||!fases.length)))return null;const cmp=comprometido(tec,p.etiqueta);
  return (lista||necessidade(p,fases)).map(n=>{const e=estDe(tec,n),b=e?+e.bolsao||0:0,v=e?+e.elleven||0:0,c=cmp[n.cod||'d:'+normK(n.desc)]||0,disp=b+v-c;return Object.assign({},n,{bolsao:b,elleven:v,comp:c,disp,st:disp>=n.qtd?'ok':disp>0?'parcial':'falta'})})}

const IDB={p:null,open(){if(!this.p)this.p=new Promise((res,rej)=>{try{const r=indexedDB.open('impl_anexos',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});return this.p},
  async tx(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('f',mode),st=t.objectStore('f'),rq=fn(st);t.oncomplete=()=>res(rq&&rq.result);t.onerror=()=>rej(t.error)})},
  put(k,v){return this.tx('readwrite',s=>s.put(v,k))},get(k){return this.tx('readonly',s=>s.get(k))},del(k){return this.tx('readwrite',s=>s.delete(k))}};

function blocoAcao(a){

    case 'lpu':if(S.lpus.some(x=>x.ag===a.id)){act=`<div class="result ok">A LPU desta atividade já foi enviada.</div><button class="bigbtn" data-act="lpuJaEnviada" data-id="${a.id}">Encerrar a atividade</button>`;break}act=`${a.parcial?`<div class="result warn"><b>Atividade não concluída:</b> ${esc(a.motivo||'')}${a.obsMotivo?'. '+esc(a.obsMotivo):''}<br>Lance na LPU somente o que foi executado nesta visita.</div>`:''}<p class="muted" style="margin:0">Lance os serviços executados nesta visita.</p><button class="bigbtn" data-act="lpuAbrir" data-id="${a.id}">Preencher a LPU</button>`;break;

    case 'nao_concluida':{const l=S.lpus.find(x=>x.ag===a.id);act=`<div class="result bad"><b>Não realizada:</b> ${esc(a.motivo)}${a.obsMotivo?'. '+esc(a.obsMotivo):''}${a.reag?`<br>Reagendada para ${dBR(a.reag)}.`:a.pendReag?'<br>Aguardando reagendamento pelo encarregado.':''}</div>${l?`<div class="result">LPU do que foi feito enviada ${lchip(l.status)}${aprovPor(l)?`<br><small>${aprovPor(l)}</small>`:''}</div><button class="btn wide" data-act="pdfArq" data-id="${l.id}">Abrir PDF da LPU</button>`:t.chegada?`<button class="btn wide" data-act="lpuParcial" data-id="${a.id}">Fiz parte do serviço: lançar na LPU</button>`:''}`;break}
  }
  return{etapas,act};
}

/* ---------- CARIMBO DAS FOTOS: horário, data, endereço, coordenadas e código ---------- */
const CARIMBO=(()=>{
  let ultPos=null,seq=0;const endCache={};
  const MES=['jan.','fev.','mar.','abr.','mai.','jun.','jul.','ago.','set.','out.','nov.','dez.'],SEM=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'],pad=n=>String(n).padStart(2,'0');
  function pos(maxAge){return new Promise(res=>{if(ultPos&&Date.now()-ultPos.em<(maxAge||120000))return res(ultPos);if(!navigator.geolocation)return res(null);
    navigator.geolocation.getCurrentPosition(p=>{ultPos={lat:p.coords.latitude,lon:p.coords.longitude,em:Date.now()};res(ultPos)},()=>res(null),{enableHighAccuracy:true,timeout:12000,maximumAge:60000})})}
  function tiff(v,t){const le=v.getUint16(t)===0x4949,u16=p=>v.getUint16(p,le),u32=p=>v.getUint32(p,le);
    const ifd=off=>{const n=u16(t+off),r={};for(let i=0;i<n;i++){const e=t+off+2+i*12;r[u16(e)]={cnt:u32(e+4),vo:e+8}}return r};
    const ascii=en=>{const off=en.cnt>4?t+u32(en.vo):en.vo;let s='';for(let i=0;i<en.cnt-1;i++)s+=String.fromCharCode(v.getUint8(off+i));return s};
    const rat3=en=>{const off=t+u32(en.vo),r=i=>u32(off+i*8)/(u32(off+i*8+4)||1);return r(0)+r(1)/60+r(2)/3600};
    const dataDe=en=>{const m=en&&ascii(en).match(/(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d):(\d\d)/);return m?new Date(+m[1],m[2]-1,+m[3],+m[4],+m[5],+m[6]):null};
    const i0=ifd(u32(t+4));let data=null,lat=null,lon=null;
    if(i0[0x8769]){const ex=ifd(u32(i0[0x8769].vo));data=dataDe(ex[0x9003]||ex[0x9004])}
    if(!data)data=dataDe(i0[0x0132]);
    if(i0[0x8825]){const g=ifd(u32(i0[0x8825].vo));if(g[2]&&g[4]){lat=rat3(g[2]);lon=rat3(g[4]);const ref=e=>e?String.fromCharCode(v.getUint8(e.vo)):'';if(ref(g[1])==='S')lat=-lat;if(ref(g[3])==='W')lon=-lon;if(!lat&&!lon)lat=lon=null}}
    return{data,lat,lon}}
  function exif(buf){try{const v=new DataView(buf);if(v.getUint16(0)!==0xFFD8)return null;let o=2;while(o<v.byteLength-10){const mk=v.getUint16(o);if((mk&0xFF00)!==0xFF00)return null;const len=v.getUint16(o+2);if(mk===0xFFE1&&v.getUint32(o+4)===0x45786966)return tiff(v,o+10);o+=2+len}}catch(e){}return null}
  async function endereco(lat,lon,inv){const k=lat.toFixed(4)+','+lon.toFixed(4);if(k in endCache)return endCache[k];let t='';try{const r=await inv('reverse',{lat,lon});t=(r&&r.label)||''}catch(e){}endCache[k]=t;return t}
  // o = {etq, cam (veio da câmera), inv (chamada da função agenda-rota)}
  async function meta(file,o){o=o||{};let dt=null,lat=null,lon=null;
    try{const e=exif(await file.slice(0,262144).arrayBuffer());if(e){dt=e.data;if(e.lat!=null){lat=e.lat;lon=e.lon}}}catch(e){}
    const fresca=o.cam||(Date.now()-(file.lastModified||0)<5*60000);let galeria=false;
    if(fresca){if(!dt)dt=new Date();if(lat==null){const p=await pos();if(p){lat=p.lat;lon=p.lon}}}
    if(!dt){dt=new Date();galeria=true}
    const end=lat!=null&&o.inv?await endereco(lat,lon,o.inv):'';seq++;
    const cod=String(o.etq||'FOTO').toUpperCase()+'-'+pad(dt.getDate())+pad(dt.getMonth()+1)+'-'+pad(dt.getHours())+pad(dt.getMinutes())+'-'+pad(seq);
    return{dt,lat,lon,end,cod,galeria:galeria&&lat==null}}
  function quebra(x,txt,max){const w=txt.split(' '),L=[];let l='';w.forEach(p=>{const t=l?l+' '+p:p;if(x.measureText(t).width>max&&l){L.push(l);l=p}else l=t});if(l)L.push(l);return L.slice(0,3)}
  function desenhar(c,m){const x=c.getContext('2d'),W=c.width,H=c.height,u=Math.min(W,H)/100,P=3.2*u,F='"Barlow",Arial,sans-serif',FC='"Barlow Condensed","Arial Narrow",Arial,sans-serif';
    const tira=5.2*u,yT=H-tira;
    x.font=`500 ${3.3*u}px ${F}`;const endTxt=m.galeria?'Foto da galeria, sem localização':(m.end||(m.lat!=null?'':'Localização indisponível'));
    const linhas=endTxt?quebra(x,endTxt,W-2*P):[];const temC=m.lat!=null;
    const hC=temC?5*u:0,yC=yT-1.8*u-hC,yE=(temC?yC:yT)-1.6*u-linhas.length*4.3*u,yH=yE-1.4*u;
    const g=x.createLinearGradient(0,yH-14*u,0,H);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.35,'rgba(0,0,0,.45)');g.addColorStop(1,'rgba(0,0,0,.72)');x.fillStyle=g;x.fillRect(0,yH-14*u,W,H-(yH-14*u));
    x.fillStyle='#fff';x.textBaseline='alphabetic';
    const hora=pad(m.dt.getHours())+':'+pad(m.dt.getMinutes());x.font=`400 ${12*u}px ${FC}`;x.fillText(hora,P,yH);const tw=x.measureText(hora).width;
    x.fillStyle='#F2B33D';x.fillRect(P+tw+2*u,yH-9.2*u,.7*u,9.2*u);x.fillStyle='#fff';x.font=`500 ${3.4*u}px ${F}`;
    x.fillText(pad(m.dt.getDate())+' '+MES[m.dt.getMonth()]+' '+m.dt.getFullYear(),P+tw+4*u,yH-5.4*u);x.fillText(SEM[m.dt.getDay()],P+tw+4*u,yH-1*u);
    x.font=`500 ${3.3*u}px ${F}`;linhas.forEach((l,i)=>x.fillText(l,P,yE+(i+1)*4.3*u-0.8*u));
    if(temC){const t='Coordenadas: '+m.lat.toFixed(6)+', '+m.lon.toFixed(6);x.font=`500 ${3.1*u}px ${F}`;const w=x.measureText(t).width;x.fillStyle='rgba(0,0,0,.35)';x.fillRect(P-u,yC,w+2*u,hC);x.fillStyle='#fff';x.fillText(t,P,yC+hC-1.5*u)}
    x.fillStyle='rgba(0,0,0,.6)';x.fillRect(0,yT,W,tira);x.fillStyle='#E3E8DF';x.font=`500 ${2.8*u}px ${F}`;const lb='Código da foto: ',lw=x.measureText(lb).width;x.fillText(lb,P,H-1.7*u);x.fillStyle='#fff';x.font=`700 ${2.8*u}px ${F}`;x.fillText(m.cod,P+lw+0.3*u,H-1.7*u)}
  return{meta,desenhar,pos};

const normK=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const coords=u=>{const m=String(u||'').match(/(-?\d{1,3}\.\d+)\s*[+,\s]\s*(-?\d{1,3}\.\d+)/);return m?[+m[1],+m[2]]:null};
const mapUrl=u=>{const c=coords(u);return c?`https://www.google.com/maps/search/?api=1&query=${c[0]},${c[1]}`:u};
function buildEnd(e){const rua=[e.logradouro,e.numero].filter(Boolean).join(', ');const b=[rua,e.bairro,[e.cidade,e.uf].filter(Boolean).join('/')].filter(Boolean).join(', ');return b?b+(e.cep?`, CEP ${e.cep}`:''):''}
function semExtOf(t){if(!(t.pa||'').trim()||!(t.pd||'').trim())return null;const c1=coords(t.locPa),c2=coords(t.locPd);const mesmaLoc=c1&&c2?Math.abs(c1[0]-c2[0])<1e-6&&Math.abs(c1[1]-c2[1])<1e-6:(t.locPa||'').trim()===(t.locPd||'').trim();return normK(t.pa)===normK(t.pd)&&mesmaLoc}
const extNote=t=>{const v=semExtOf(t);return v===true?'<p class="note">Ponto de acesso e de derivação iguais: projeto sem extensão de sinal. A fase sai do fluxo.</p>':v===false?'<p class="note">Pontos diferentes: projeto com extensão de sinal.</p>':'<p class="muted">Informe os pontos de acesso e de derivação para o sistema definir se há extensão de sinal.</p>'};
function parseInst(txt){
  const r={notas:[]};let last=null;
  String(txt||'').split(/\r?\n/).forEach(l=>{const s=l.trim();if(!s||/^-{2,}/.test(s))return;
    const m=s.match(/^([^:]{2,60}?):\s*(.*)$/);if(!m||/^https?$/i.test(m[1].trim())){r.notas.push(s);return}
    const k=normK(m[1]),v=m[2].trim();
    if(k==='cep')r.cep=v;else if(k.startsWith('logradouro'))r.logradouro=v;else if(k.startsWith('numero'))r.numero=v;else if(k.startsWith('bairro'))r.bairro=v;
    else if(k==='estado'||k==='uf')r.uf=v;else if(k.startsWith('cidade'))r.cidade=v;else if(k==='pop')r.pop=v;else if(k.startsWith('equipamento'))r.equip=v;else if(k.startsWith('porta'))r.porta=v;
    else if(k.startsWith('ponto de acesso')){r.pa=v;last='pa'}else if(k.startsWith('ponto de deriva')){r.pd=v;last='pd'}
    else if(k.startsWith('localiza')){if(last==='pd')r.locPd=v;else r.locPa=v}else r.notas.push(s)});
  r.endereco=buildEnd(r);r.semExt=semExtOf(r);
  return r;
}
function instPreview(r){

const TOPO_RULES=[['GPON','ONU',/\bONU\b/i],['Ponto a ponto','GBIC',/\bGBIC\b/i],['Firewall','Fortinet/Fortigate',/\bf[o0]r?t[iy]?\s*-?\s*(net|gate)/i],['Voz','Telefone',/telefon/i]];

  const nome=k=>k.replace(/^PONTA\s+/,'Ponta ');

const roiTable=itens=>{const tp=itens.some(i=>i.tipo),un=itens.some(i=>i.un);return `<div class="tablewrap roiitems"><table><thead><tr><th>Item</th>${tp?'<th>Tipo</th>':''}<th class="r">Qtd</th>${un?'<th>Un.</th>':''}</tr></thead><tbody>${itens.map(i=>`<tr><td style="white-space:normal">${esc(i.desc)}</td>${tp?`<td>${esc(i.tipo||'')}</td>`:''}<td class="r">${(+i.qtd||0).toLocaleString('pt-BR')}</td>${un?`<td>${esc(i.un||'')}</td>`:''}</tr>`).join('')}</tbody></table></div>`};
function detectTopo(txt){const achados=TOPO_RULES.filter(t=>t[2].test(txt)).map(t=>t[1]);const rb=RB_RE.test(txt);const regra=TOPO_RULES.find(t=>t[2].test(txt));if(rb)achados.push('RB');return{achados,topologia:regra?regra[0]:(rb?'Last mile':null)}}
const ROI_LABELS={'cliente':'cliente','protocolo':'protocolo','etiqueta':'etiqueta','valor mensal':'valor','taxa de instalacao':'taxa','custo total':'custoTotal','roi':'roiIdx','custo mao de obra':'custoMO','valor materiais':'valorMat','custos adicionais':'custosAdic'};
const ROI_NUM=['valor','taxa','custoTotal','roiIdx','custoMO','valorMat','custosAdic'];
const labelKey=t=>ROI_LABELS[normK(String(t||'')).replace(/^\*\s*/,'').replace(/[:\s]+$/,'')];
function finishFields(o){const r={};Object.entries(o).forEach(([k,v])=>{r[k]=ROI_NUM.includes(k)?num(v):String(v).trim()});return r}
function headerFields(lines){
  const o={},L=lines.map(l=>l.trim());
  L.forEach((l,i)=>{const cells=l.split('\t');if(cells.length>1)return;const m=l.match(/^(.+?)\s*:\s*(.+)$/);
    if(m&&labelKey(m[1])){o[labelKey(m[1])]??=m[2];return}
    const k=labelKey(l);if(k&&L[i+1]&&!labelKey(L[i+1])&&!(L[i+1].split('\t').length>1))o[k]??=L[i+1]});
  return finishFields(o);
}
function formFields(rows){
  const o={};rows.forEach((r,i)=>{const nx=rows[i+1];if(!nx)return;r.forEach(c=>{const k=labelKey(c.s);if(!k||o[k]!==undefined)return;const v=nx.find(d=>d.x>=c.x-3&&d.x<=c.x+25&&!labelKey(d.s));if(v)o[k]=v.s})});
  return finishFields(o);

function roiFromLines(lines,nome){
  const base=roiFromRows(lines.map(l=>l.split('\t')));const full=lines.join('\n');const t=detectTopo(full);
  return Object.assign({nome},base,t,headerFields(lines));
}
async function pdfRead(buf){
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;const lines=[],rowsOut=[];
  for(let n=1;n<=pdf.numPages;n++){const pg=await pdf.getPage(n),tc=await pg.getTextContent(),rows={};
    tc.items.forEach(it=>{if(!it.str||!it.str.trim())return;const y=Math.round(it.transform[5]/3)*3;(rows[y]=rows[y]||[]).push({x:it.transform[4],w:it.width||0,s:it.str})});
    Object.keys(rows).map(Number).sort((a,b)=>b-a).forEach(y=>{const cells=[];rows[y].sort((a,b)=>a.x-b.x).forEach(i=>{const last=cells[cells.length-1];const g=last?i.x-last.end:99;
      if(last&&g<3.5){last.s+=(g>1?' ':'')+i.s;last.end=i.x+i.w}else cells.push({x:i.x,end:i.x+i.w,s:i.s})});
      cells.forEach(c=>c.s=c.s.replace(/\s+/g,' ').trim());rowsOut.push(cells);lines.push(cells.map(c=>c.s).join('\t'))})}
  return{lines,rows:rowsOut};
}
function tableFromPdf(rows){
  const isQ=c=>/^(qtd|qtde|quant)/i.test(c),isD=c=>/descri|material|produto|equipamento/i.test(c);
  const hi=rows.findIndex(r=>r.some(c=>isQ(c.s))&&r.some(c=>isD(c.s)));if(hi<0)return null;
  const H=rows[hi].slice().sort((a,b)=>a.x-b.x),span=H.map((c,i)=>[c.x-3,i+1<H.length?H[i+1].x-3:1e9]);
  const out=[H.map(c=>c.s)];
  rows.slice(hi+1).forEach(r=>{const cells=H.map(()=>[]);r.forEach(c=>{let best=0,bo=-1e9;span.forEach(([a,b],k)=>{const o=Math.min(c.end,b)-Math.max(c.x,a);if(o>bo){bo=o;best=k}});cells[best].push(c.s)});out.push(cells.map(x=>x.join(' ')))});
  return out;
}
function roiFromPdf(rd,nome){const t=tableFromPdf(rd.rows);const r=roiFromLines(rd.lines,nome);Object.assign(r,formFields(rd.rows));if(t)Object.assign(r,roiFromRows(t));return r}
function roiFromRows(rows){
  rows=rows.map(r=>r.map(c=>String(c??'').trim())).filter(r=>r.some(Boolean));
  const isQ=c=>/^(qtd|qtde|quant)/i.test(c),isD=c=>/descri|item|material|produto|equipamento/i.test(c);
  const hi=rows.findIndex(r=>r.some(isQ)&&r.some(isD));let qi=-1,di=-1,ui2=-1;
  if(hi>=0){const h=rows[hi];qi=h.findIndex(isQ);di=h.findIndex(c=>/descri/i.test(c));if(di<0)di=h.findIndex(isD);ui2=h.findIndex(c=>/^(un|und|unid|unidade)\b/i.test(c));var ti=h.findIndex(c=>/^tipo$/i.test(c)),ci=h.findIndex(c=>/c[oó]digo/i.test(c))}
  const itens=[];
  rows.slice(hi+1).forEach(r=>{let desc,qtd=0,un='';
    let tipo='',cod='';if(hi>=0){desc=r[di]||'';qtd=num(r[qi]);un=ui2>=0?r[ui2]||'':'';tipo=ti>=0?r[ti]||'':'';cod=ci>=0?(r[ci]||'').trim():''}
    else{const line=r.join(' ');const m=line.match(/(\d+(?:[.,]\d+)*)\s*(km|mts?|metros?|m)\b/i);
      if(m){qtd=num(m[1]);un=/km/i.test(m[2])?'km':'m'}else{const n=r.find(c=>/^\d+(?:[.,]\d+)*$/.test(c));if(n)qtd=num(n)}
      desc=r.filter(c=>!/^\d+(?:[.,]\d+)*$/.test(c)).join(' ')}
    if(/[a-zà-ú]/i.test(desc))itens.push({cod:/^[A-Z]{2,4}\d{4,}$/.test(cod)?cod:'',desc,qtd,un,tipo})});
  const{achados,topologia}=detectTopo(itens.map(i=>i.desc).join(' \n '));

}

        if((k==='a'||k==='l')&&!(q.data||[]).length){try{await sb.auth.refreshSession()}catch(e){}q=await sb.from(TBL[k]).update(x).eq(K,x[K]).select(K);if(q.error)throw q.error;if(!(q.data||[]).length)throw new Error('o banco não aceitou a alteração (login expirado ou sem permissão). Saia e entre de novo na ferramenta')}

/* ---------- TEMPOS DE ATENDIMENTO (Implantação e GTD Manutenção) ----------
   Implantação: Deslocamento = saída → chegada; Espera no cliente = chegada → início; Atividade = início → conclusão
     (vários dias: soma os dias, início → fim do dia); Relatório = conclusão → relatórios enviados (ts.relatorios, gravado desde 08/10/2026).
   GTD: Deslocamento = saída → chegada; Espera no cliente = chegada → início do atendimento; Atendimento = início → validação pedida;
     Validação do NOC = pedido → validado; RFO = validado → RFO gerado.
   Expurgo por etapa em tabelas próprias (ag_expurgos e ag_expurgos_gtd, ajuste 18), fora do salvamento automático,
   para o técnico nunca sobrescrever a decisão da gestão. */
const TP_REL_DESDE='08/10/2026';
const TP_MOT=['Etapa não registrada na hora (horário não confere)','Técnico esqueceu de avançar a etapa','Atividade interrompida por fator externo (cliente, acesso, energia)','Registro de teste ou indevido','Outro'];
const TP={

    filtro:{rot:'Fase',pad:'ativ',ops:()=>[['ativ','Ativação'],...FASES.filter(f=>f.k!=='ativ').map(f=>[f.k,f.n]),...EXTRAS.map(f=>[f.k,f.n]),['all','Todas as fases e atividades']]},

      return Object.assign(c,{id:a.id,data:a.data,cli:p.cliente||a.etiqueta,sub:a.etiqueta,tag:fasesOf(a).map(k=>FCURTO[k]).join(' + '),busca:(p.cliente||'')+' '+a.etiqueta+' '+(p.protocolo||''),tecId:a.tec,tecNome:tecN(a.tec),vinc:tecT(a.tec)==='TERC'?'Terceiro':'CLT'})})},
    nota:`Considera atividades concluídas (inclusive com relatórios ou LPU pendentes) com data no período. Deslocamento: saída até a chegada. Espera no cliente: chegada até o início. Atividade: início até a conclusão; em atividades de vários dias, soma os dias. Relatório: da conclusão até o envio dos relatórios (gravado a partir de ${TP_REL_DESDE}; atividades anteriores aparecem como sem registro e não entram na média do relatório).`},
  gtd:{nome:'GTD Manutenção',item:'chamado',itens:'Chamados',cons:'Chamados considerados',
    et:[['desloc','Deslocamento','Deslocamento médio'],['espera','Espera no cliente','Espera média no cliente'],['atend','Atendimento','Atendimento médio'],['valid','Validação do NOC','Validação média do NOC'],['rfo','RFO','RFO médio']],
    campo:['desloc','espera','atend'],cor:{desloc:'var(--info)',espera:'var(--warn)',atend:'var(--brand)',valid:'var(--tp-noc)',rfo:'var(--tp-rel)'},forte:'atend',
    lim:{desloc:{max:240,min:1},espera:{max:180,min:null},atend:{max:600,min:3},valid:{max:240,min:null},rfo:{max:1440,min:null}},
    perm:'a_gExpurgo',tabela:'ag_expurgos_gtd',fk:'chamado',script:'agenda_ajuste_18',

    linhas(st,ini,fim){return G.ch.filter(c=>['rfo','lpu','aprov','concl'].includes(c.status)&&gDiaDe(c)>=ini&&gDiaDe(c)<=fim&&(st.f==='all'||c.categoria===st.f)&&(!st.tec||c.tec===st.tec)).map(c=>{const k=tpCalcGtd(c);

    nota:'Considera chamados validados pelo NOC (RFO, LPU, aprovação ou concluídos) com abertura no período. Deslocamento: saída até a chegada. Espera no cliente: chegada até o início do atendimento. Atendimento: início até o pedido de validação (se o NOC não validou e o técnico voltou ao atendimento, conta até o último pedido). Validação do NOC: pedido até a validação. RFO: validação até o RFO gerado.'}};
function tpTrechos(a){const L=(a.diario||[]).map(x=>Object.assign({},x.ts||{},{fim:(x.ts||{}).fimDia}));const t=a.ts||{};if(t.desloc||t.chegada||t.inicio)L.push(Object.assign({},t,{fim:t.conclusao}));return L}
function tpCalcImpl(a){const tr=tpTrechos(a),f={desloc:t=>dur(t.desloc,t.chegada),espera:t=>dur(t.chegada,t.inicio),exec:t=>dur(t.inicio,t.fim)},v={},inc={},nota={};
  TP.impl.campo.forEach(k=>{let s=0,ok=false;tr.forEach(t=>{const m=f[k](t);if(m==null)inc[k]=true;else{s+=m;ok=true}});v[k]=ok?s:null;if(!tr.length)inc[k]=true});
  // relatório: só depois da conclusão final; antes de 08/10/2026 o envio dos relatórios não era gravado
  const t=a.ts||{};v.rel=null;if(!relsDe(a).length)nota.rel='não exige';else if(a.status==='relatorios')nota.rel='pendente';else if(!t.relatorios||!t.conclusao)nota.rel='sem registro';else v.rel=dur(t.conclusao,t.relatorios);
  return{v,inc,nota,dias:tr.length}}
function tpCalcGtd(c){const t=c.ts||{},vd=t.validado||c.validadoEm,v={},inc={},nota={};
  v.desloc=dur(t.desloc,t.chegada);v.espera=dur(t.chegada,t.inicio);v.atend=dur(t.inicio,t.pedido);TP.gtd.campo.forEach(k=>{if(v[k]==null)inc[k]=true});
  v.valid=dur(t.pedido,vd);if(v.valid==null)nota.valid='sem registro';

  return{v,inc,nota,dias:1}}
const tpMed=arr=>{if(!arr.length)return null;const s=arr.slice().sort((a,b)=>a-b),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
const tpSt=K=>{const k='tp_'+K;if(!ui[k])ui[k]={f:TP[K].filtro.pad,tec:'',q:'',sit:'todas',lim:60,cliTodos:false};return ui[k]};
function tpBase(K){const C=TP[K],st=tpSt(K),q=normK(st.q||''),[ini,fim]=C.per(),EX=C.ex();
  const R=C.linhas(st,ini,fim).filter(r=>!q||normK(r.busca).includes(q)).map(r=>{const x=EX[r.id]||null,ex=x?(x.etapas||[]):[];return Object.assign(r,{x,ex,todoEx:C.campo.every(k=>ex.includes(k)),use:k=>r.v[k]!=null&&!ex.includes(k)})});
  // fora do padrão: incompleto, muito curto, acima do limite ou acima de 3x a mediana da etapa
  const med={};C.et.forEach(([k])=>{const L=R.filter(r=>r.use(k)).map(r=>r.v[k]);med[k]=L.length>=5?tpMed(L):null});
  R.forEach(r=>{r.alerta={};C.et.forEach(([k])=>{const v=r.v[k],L=C.lim[k];if(r.ex.includes(k)||r.nota[k])return;
    if(v==null||r.inc[k])r.alerta[k]='Etapa sem registro completo';

  var seg = s.split(/,|\||\s-\s/).map(function (x) { return x.replace(/[-\/\s]+sp\.?$/i, '').replace(/^munic[ií]pio de\s*/i, '').trim(); })
    .filter(function (x) { return x && /[a-z]/i.test(x) && !/^sp$/i.test(x) && !/^estado de/i.test(x); });

    ['Gerência', /gerencia/],

    ['Equipamento / energia', /integridade do equipamento|verificar equipamento|energia|eletric|fonte|dgi/],

  var alvos = [gtdNorm(motivo), gtdNorm(obs)];

function gTimeline(c){const t=c.ts||{},ev=[['Chamado criado'+(c.criadoPorNome?' por '+c.criadoPorNome+(c.criadoPapel?' ('+c.criadoPapel+')':''):''),c.criadoEm]];
